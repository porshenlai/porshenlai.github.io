<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>計程車費率計算專題</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 90%;
            max-width: 700px;
            background-color: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.1);
        }
        h1 {
            color: #007bff;
            text-align: center;
            margin-bottom: 20px;
        }
        .input-group {
            margin-bottom: 20px;
        }
        .input-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #555;
        }
        .input-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 15px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1.1em;
            font-weight: bold;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #1e7e34;
        }
        #result-area {
            margin-top: 30px;
            padding: 20px;
            background-color: #e6f7ff;
            border-radius: 8px;
            border-left: 5px solid #007bff;
        }
        #result-area p {
            margin: 10px 0;
            font-size: 1.1em;
        }
        .fare-result {
            font-size: 1.5em;
            color: #dc3545;
            font-weight: bold;
        }
        .loading {
            color: #ffc107;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>計程車費率模擬器</h1>
        <p>此工具將使用 OpenStreetMap (OSM) 數據計算實際道路距離。</p>

        <div class="input-group">
            <label for="startAddress">起點地址 (例如：台北車站)</label>
            <input type="text" id="startAddress" value="台北車站">
        </div>

        <div class="input-group">
            <label for="endAddress">終點地址 (例如：台北 101)</label>
            <input type="text" id="endAddress" value="台北 101">
        </div>

        <button onclick="getDistanceAndCalculateFare()">計算費率</button>

        <div id="result-area">
            <p id="distanceResult">距離：等待計算...</p>
            <p id="fareResult">預估費用：<span class="fare-result">請點擊上方按鈕</span></p>
            <p id="debugInfo" style="font-size: 0.8em; color: #6c757d;"></p>
        </div>
    </div>

    <script>
        // 設定 Open Service API 端點
        const NOMINATIM_URL = 'https://nominatim.openstreetmap.org/search';
        const OSRM_URL = 'https://router.project-osrm.org/route/v1/driving';
        
        // ----------------------------------------------------
        // 1. 【學生專注區】計費規則函式
        // 學生應該修改此函式來實作他們的計費專題
        // ----------------------------------------------------
        /**
         * 根據距離計算計程車費率。
         * @param {number} distanceKm - 兩地之間的道路距離 (公里)。
         * @returns {number} - 計算出的總費用 (新台幣)。
         */
        function calculateFare(distanceKm) {
            // 這裡模擬台北市的計費規則 (僅為範例，實際規則請依專題要求調整)
            const BASE_FARE = 85;           // 起跳價 (1.25 公里內)
            const BASE_DISTANCE_KM = 1.25;  // 起跳距離
            const RATE_PER_STEP = 5;        // 每跳錶增加的金額
            const STEP_DISTANCE_KM = 0.20;  // 每 200 公尺跳錶一次

            let totalFare = BASE_FARE;

            if (distanceKm > BASE_DISTANCE_KM) {
                // 超過起跳距離的部分
                const excessDistance = distanceKm - BASE_DISTANCE_KM;
                
                // 計算跳錶次數：將多餘距離除以跳錶間隔，並無條件進位
                const steps = Math.ceil(excessDistance / STEP_DISTANCE_KM);
                
                totalFare += steps * RATE_PER_STEP;
            }

            // 費率可以四捨五入或無條件進位，這裡採用四捨五入取整
            return Math.round(totalFare);
        }
        
        // ----------------------------------------------------
        // 2. 核心 API 呼叫邏輯
        // ----------------------------------------------------

        /**
         * 呼叫 Nominatim 服務，將地址轉換為經緯度。
         * @param {string} address - 查詢的地址。
         * @returns {Promise<Object | null>} - 包含 {lat, lon} 的物件，失敗則為 null。
         */
        async function geocodeAddress(address) {
            const url = `${NOMINATIM_URL}?q=${encodeURIComponent(address)}&format=json&limit=1`;
            try {
                const response = await fetch(url, {
                    headers: { 'User-Agent': 'Taxi Fare Calculator Project' } // 禮貌性提供 User-Agent
                });
                const data = await response.json();

                if (data && data.length > 0) {
                    return {
                        lat: parseFloat(data[0].lat),
                        lon: parseFloat(data[0].lon),
                        display: data[0].display_name
                    };
                }
            } catch (error) {
                console.error("Geocoding 服務發生錯誤:", error);
            }
            return null;
        }

        /**
         * 呼叫 OSRM 服務，計算兩組經緯度之間的道路距離。
         * @param {Object} startCoords - 起點 {lat, lon}。
         * @param {Object} endCoords - 終點 {lat, lon}。
         * @returns {Promise<number | null>} - 道路距離 (公里)，失敗則為 null。
         */
        async function getRoadDistance(startCoords, endCoords) {
            // OSRM 格式: /lon1,lat1;lon2,lat2
            const coordinates = `${startCoords.lon},${startCoords.lat};${endCoords.lon},${endCoords.lat}`;
            const url = `${OSRM_URL}/${coordinates}?overview=false`;

            try {
                const response = await fetch(url);
                const data = await response.json();

                if (data.code === 'Ok' && data.routes && data.routes.length > 0) {
                    // OSRM 回傳的距離單位是公尺 (meters)
                    const distanceMeters = data.routes[0].distance;
                    return distanceMeters / 1000; // 轉換為公里
                }
            } catch (error) {
                console.error("OSRM Routing 服務發生錯誤:", error);
            }
            return null;
        }

        /**
         * 主控函式：處理使用者輸入、取得距離、計算費用並顯示結果。
         */
        async function getDistanceAndCalculateFare() {
            const startAddress = document.getElementById('startAddress').value.trim();
            const endAddress = document.getElementById('endAddress').value.trim();
            const distanceResultEl = document.getElementById('distanceResult');
            const fareResultEl = document.getElementById('fareResult');
            const debugInfoEl = document.getElementById('debugInfo');

            distanceResultEl.innerHTML = '<span class="loading">正在查詢地址並規劃路線...</span>';
            fareResultEl.innerHTML = '<span class="fare-result loading">計算中...</span>';
            debugInfoEl.textContent = '';
            
            if (!startAddress || !endAddress) {
                alert('請輸入起點和終點地址！');
                distanceResultEl.textContent = '距離：查詢失敗';
                fareResultEl.innerHTML = '預估費用：請輸入完整資訊';
                return;
            }

            // --- 1. 地址轉座標 ---
            const startCoords = await geocodeAddress(startAddress);
            const endCoords = await geocodeAddress(endAddress);

            if (!startCoords || !endCoords) {
                const failedAddr = !startCoords ? startAddress : endAddress;
                alert(`無法找到地址 "${failedAddr}" 的座標。請嘗試更精確的地址。`);
                distanceResultEl.textContent = '距離：查詢失敗';
                fareResultEl.innerHTML = '預估費用：無法取得地理資訊';
                return;
            }
            
            debugInfoEl.innerHTML = `起點座標: ${startCoords.lat.toFixed(4)}, ${startCoords.lon.toFixed(4)}<br>終點座標: ${endCoords.lat.toFixed(4)}, ${endCoords.lon.toFixed(4)}`;

            // --- 2. 座標計算道路距離 ---
            const distanceKm = await getRoadDistance(startCoords, endCoords);

            if (distanceKm === null) {
                distanceResultEl.textContent = '距離：無法計算道路距離。';
                fareResultEl.innerHTML = '預估費用：規劃路線失敗';
                return;
            }

            // --- 3. 執行計費邏輯 (學生專題部分) ---
            const totalFare = calculateFare(distanceKm);
            
            // --- 4. 顯示結果 ---
            distanceResultEl.textContent = `距離：${distanceKm.toFixed(2)} 公里`;
            fareResultEl.innerHTML = `預估費用：<span class="fare-result">TWD ${totalFare.toLocaleString()}</span>`;
        }

    </script>

</body>
</html>
