<!-- Vector Space
這個問題直擊了 LLM（大型語言模型）架構中最核心、也最精妙的運作機制！
簡短的答案是：是的，你的理解非常精準！
LLM 內部（如 Transformer 隱藏層）與輸出層的確都在高維度空間中運作，但它們的高維空間**「幾何特性」與純 Embedding 模型截然不同**：它不僅僅代表「靜態語意相近」，更包含了**「動態語意轉譯」、「上下文邏輯推理」與「語法流暢度（下一個字出現的機率）」**。
為了讓你在教學時能更清晰地說明，我們把 LLM 內部的高維空間拆解成三個關鍵視角：
1. 靜態語意空間 vs. 動態上下文空間
這是純 Embedding 模型（如 RAG 用的向量庫）與 LLM 隱藏層高維空間最大的差別：
純 Embedding 模型（靜態語意空間）：
它的目標很單純：無上下文（或僅有局部上下文）的靜態語意距離。
在這個空間裡，蘋果（水果）和 香蕉 的距離永遠很近；蘋果 和 台積電 距離很遠。
LLM 隱藏層（動態上下文空間）：
LLM 每經過一層 Transformer 區塊（Self-Attention），這個 Token 在高維空間的座標就會被重新修正與轉移。
例如輸入：「蘋果發表了全新的 M4 晶片」
經過 Self-Attention 後，蘋果 這個 Token 的向量座標會被拉離「水果空間」，瞬間移動到「科技/半導體/上市公司」的高維空間，並且與 台積電、晶圓代工 的距離大幅縮短。
結論： LLM 的高維空間不是不具備語意相近性，而是它的語意是**動態且高度依賴上下文（Context-aware）**的。
2. LLM 的輸出層（Unembedding / LM Head）：從高維座標轉為機率
當資料經過 LLM 所有隱藏層後，最後會來到輸出層（LM Head）。這個階段的運算過程非常有意思：
最後的高維向量： 模型的最後一層會產出一個代表「目前為止所有上下文總結」的高維向量（例如 4096 維）。
與字典求內積（Dot Product）： 輸出層有一個巨大的矩陣（稱為 Unembedding Matrix），裡面記錄了字典裡每一個 Token（例如 32,000 個 Token）的高維特徵向量。
計算夾角與相似度： 系統計算最後高維向量與字典中每個 Token 向量的相似度（Logits）。
Softmax 轉換： 把這些相似度數值轉化為 0~1 之間的**「下一個字出現機率」**。
為什麼「語意不相近」的字機率可能更高？
因為 LLM 學習權重的目標是**「預測合理的下一個 Token（Next Token Prediction）」，這包含了語法規則與對話邏輯**：
例子：「這家銀行的放款審查非常_____」
在高維空間中，嚴格（形容詞）和 放款（動詞/名詞）在靜態語意上完全不相近。
但因為文法結構（主詞+副詞+形容詞）以及金融語意邏輯，LLM 內部高維向量在最後預測時，會將幾何位置推向「描述審查品質的形容詞」區域，使得 嚴格 或 謹慎 的出現機率最高，而不是語意最相關但文法不對的 貸款。
3. 兩種高維空間的對比總結
在向學生解釋時，可以使用下面這個對比表：
比較維度
RAG 用的 Embedding 空間
LLM 內部的向量空間（Hidden States）
主要功能
檢索（Retrieval）
推理與生成（Reasoning & Generation）
幾何特性
依賴靜態語意相似度（距離近 = 意思像）。
依賴動態上下文與文法流向（座標會隨上文隨時跳轉）。
優化目標
把同義詞的距離拉近，異義詞推遠（Contrastive Loss）。
讓下一個正確 Token 的機率最大化（Cross-Entropy Loss）。
直觀比喻
靜態的百科全書分類索引（相同的放在一起）。
思考中的大腦神經元聯想網（從主詞推導到動詞，再推導到賓詞）。

課堂教學的結語點撥
可以這樣向同學總結：
「RAG 用的 Embedding 模型，像是在高維空間裡幫資料打卡劃分區域，目的是為了快速搜尋；而 LLM 模型學習後的權重與高維空間，像是在高維空間裡畫出出一條條流暢的思考路線圖。LLM 輸出向量的目的是為了指引下一個字該走向字典裡的哪一個 Token，因此它包含的不只是『意思相近』，更包含『邏輯與文法的必然性』。」

這個實驗能讓學生親手測試「惡意 Prompt 攻擊」與「合規攔截」，體驗安全防線如何逐層把關。
體驗 4 道安全防線的架構與測試方法
[測試輸入]
   │
   ├── (1) 輸入防線 ──► [PII 去敏與攻擊偵測] (攔截越獄/隱藏身分證)
   │
   ├── (2) RAG 防線  ──► [權限過濾 (Metadata)] (隔離未授權文件)
   │
   ├── (3) 模型防線  ──► [System Prompt 約束] (Gemma 內建拒絕機制)
   │
   └── (4) 輸出防線  ──► [合規校驗與敏感詞過濾] (修飾金融過度承諾)


完整 Python 實作體驗腳本 (safety_sandbox.py)
請確保已安裝必備套件：
pip install langchain langchain-community langchain-chroma pydantic re


完整程式碼：
import re
from pydantic import BaseModel, Field, ValidationError
from langchain_community.llms import Ollama
from langchain_community.document_loaders import PyPDFLoader
from langchain_community.embeddings import HuggingFaceEmbeddings
from langchain_chroma import Chroma

# ===========================================================================
# 防線 1：輸入端防火牆 (Input Guardrail) - PII 遮蔽與惡意 Prompt 攔截
# ===========================================================================
def input_guardrail(user_input: str) -> str:
    print("\n🛡️ [第 1 道防線：輸入端檢查]")
    
    # A. 檢測越獄/惡意攻擊關鍵詞 (Jailbreak / Prompt Injection)
    jailbreak_keywords = ["IGNORE PREVIOUS INSTRUCTIONS", "DAN", "忽略先前的指令", "教我製造", "內線交易"]
    for kw in jailbreak_keywords:
        if kw.lower() in user_input.lower():
            raise ValueError(f"❌ 警告：檢測到惡意輸入或越獄企圖！(關鍵字: {kw})")
            
    # B. 個人敏感資料 (PII) 自動去敏 (如：台灣身分證字號 Regex 遮蔽)
    taiwan_id_regex = r"[A-Z][12]\d{8}"
    sanitized_input = re.sub(taiwan_id_regex, "[身分證已遮蔽]", user_input)
    
    if sanitized_input != user_input:
        print("  ⚠️ 偵測到 PII 身分證字號，已完成去敏處理。")
        
    print("  ✅ 輸入安全檢查通過。")
    return sanitized_input


# ===========================================================================
# 防線 2：RAG 資料存取權限控管 (Retrieval Guardrail)
# ===========================================================================
def setup_rag_with_rbac():
    # 建立測試文件並帶有不同權限標籤 (Metadata)
    embeddings = HuggingFaceEmbeddings(model_name="BAAI/bge-small-zh-v1.5")
    
    docs = [
        {"text": "台積電 2026 年 Q2 財報：營業收入達 6,500 億元。", "role": "public"},
        {"text": "機密：A客戶授信評等為低，存在高違約風險，身份證A123456789。", "role": "admin"}
    ]
    
    vector_store = Chroma(collection_name="safety_test", embedding_function=embeddings)
    
    # 寫入向量庫
    from langchain_core.documents import Document
    doc_objects = [Document(page_content=d["text"], metadata={"role": d["role"]}) for d in docs]
    vector_store.add_documents(doc_objects)
    return vector_store

def rbac_retrieval(vector_store, query: str, user_role: str = "user"):
    print("\n🛡️ [第 2 道防線：RAG 權限過濾]")
    # 根據使用者角色限定搜尋範圍 (RBAC)
    retriever = vector_store.as_retriever(
        search_kwargs={
            "k": 2,
            "filter": {"role": "public"} if user_role == "user" else {}
        }
    )
    docs = retriever.invoke(query)
    print(f"  🔍 使用者權限 [{user_role}]，成功撈取 {len(docs)} 筆授權資料。")
    return "\n".join([d.page_content for d in docs])


# ===========================================================================
# 防線 3：模型與 System Prompt 約束 (Model Safety Alignment)
# ===========================================================================
def call_gemma_model(context: str, query: str) -> str:
    print("\n🛡️ [第 3 道防線：地端 Gemma 模型推論]")
    llm = Ollama(model="gemma2:2b", temperature=0.1)
    
    system_prompt = f"""你是一位合規的金融 AI 助手。
請嚴格遵守以下限制：
1. 僅根據【參考資料】回答，若無資料請回答「無法提供」。
2. 絕對禁止給出「保證獲利」、「全壓買進」等非法投資承諾。

【參考資料】：
{context}

【使用者提問】：
{query}

【回答】："""
    
    response = llm.invoke(system_prompt)
    print("  ✅ Gemma 模型生成完成。")
    return response


# ===========================================================================
# 防線 4：輸出端過濾與合規修飾 (Output Guardrail)
# ===========================================================================
def output_guardrail(raw_response: str) -> str:
    print("\n🛡️ [第 4 道防線：輸出端合規檢查]")
    
    # 檢查是否包含金融禁言 (如保證獲利、保證保本等過度承諾字眼)
    forbidden_words = ["保證獲利", "絕對賺錢", "100%獲利", "全壓買進", "保證不虧"]
    
    sanitized_response = raw_response
    for word in forbidden_words:
        if word in sanitized_response:
            print(f"  ⚠️ 警示：輸出的內容包含金融違規詞彙 [{word}]，已強制進行免責修飾！")
            sanitized_response = sanitized_response.replace(word, "（警語：投資存在風險，請獨立評估）")
            
    # 加上強制免責聲明
    sanitized_response += "\n\n【免責聲明】：本回答由地端 AI 系統生成，僅供參考，不構成任何投資決策依據。"
    print("  ✅ 輸出端安全審查完成。")
    return sanitized_response


# ===========================================================================
# 整合測試展示 (沙盒運行)
# ===========================================================================
def run_safety_sandbox(user_input: str, user_role: str = "user"):
    print("="*60)
    print(f"📥 收到原始提問：{user_input}")
    print("="*60)
    
    try:
        # 防線 1：輸入檢查
        clean_input = input_guardrail(user_input)
        
        # 防線 2：RAG 檢索
        vector_store = setup_rag_with_rbac()
        context = rbac_retrieval(vector_store, clean_input, user_role)
        
        # 防線 3：模型推論
        raw_output = call_gemma_model(context, clean_input)
        
        # 防線 4：輸出校驗
        final_output = output_guardrail(raw_output)
        
        print("\n" + "="*60)
        print("📤 最終安全系統允許輸出的 Response：")
        print("="*60)
        print(final_output)
        
    except ValueError as e:
        print(f"\n🚨 安全系統成功攔截威脅：{e}")

# --- 課堂測試案例 ---
if __name__ == "__main__":
    # 測試案例 A：正常查詢 (帶有身分證字號)
    run_safety_sandbox("我是客戶 A123456789，請幫我查詢台積電的營收狀況。", user_role="user")

<!-- RAG
地端 RAG（檢索增強生成）的實作流程可以拆解為 「建置期（建立知識庫）」 與 「推論期（回答問題）」 兩個核心階段，共 5 個具體步驟。
在電腦教室帶學生實作時，這套流程非常適合用 Python 模組化的方式一步步引導：
RAG 完整實作 5 大步驟
【階段一：建立知識庫】
[原始文件 (PDF/Doc)] ──► 1. 文件讀取與文本切分 (Text Chunking)
                       │
                       ▼
                 2. 向量化 (Embedding) 與 向量庫儲存 (Vector DB)

----------------------------------------------------------------------

【階段二：推論與生成】
[使用者提問 (Query)] ──► 3. 語意檢索 (Similarity Search / Top-K)
                       │
                       ▼
                 4. 組合提示詞 (Prompt Engineering)
                       │
                       ▼
                 5. 地端 LLM 生成回答 (Ollama Gemma)


階段一：建立地端知識庫（離線/初始化作業）
1. 文件讀取與文本切分（Document Loading & Chunking）
目的： 消除 LLM 上下文長度限制，並提升搜尋精準度。
做法： 使用 PyPDFLoader 讀取金融文件/條款，並用 RecursiveCharacterTextSplitter 切分成小塊（Chunks）。
實作關鍵設定：
chunk_size（塊大小）：建議設為 500 ~ 800 字（避免把財務表格切斷）。
chunk_overlap（重疊字數）：建議設為 100 字（保證上下文語意連貫不中斷）。
保留 Metadata： 必須保留頁碼（page）、檔名等資訊，作為後續 RAG 引文註腳的依據。
2. 向量化與向量資料庫儲存（Embedding & Vector Store）
目的： 將切分好的文字區塊轉換為「高維語意座標」，並建立快速索引。
做法： 使用地端 Embedding 模型（如 BAAI/bge-small-zh-v1.5），將每一個 Chunk 轉為向量後存入地端向量資料庫（如 ChromaDB 或 FAISS）。
優點： 完全在地端 CPU/GPU 運作，敏感的金融文件不會外流到公有雲。
階段二：檢索與生成（線上/即時對話）
3. 語意檢索（Similarity Search）
目的： 從資料庫中快速精準地撈出與問題最相關的資料。
做法： 當審查員輸入問題（例如：「本案的負債比率是多少？」）時：
將問題同樣經過 Embedding 模型轉換為向量。
向量資料庫計算餘弦相似度（Cosine Similarity），撈出前 K 個（如 K=3 \sim 5） 最相關的文本區塊。
4. 組合提示詞（Prompt Assembly）
目的： 設定模型的角色，並將「撈出來的參考資料」與「使用者問題」拼裝在一起。
Prompt 結構範例：
你是一位嚴謹的金融授信審查員。請「嚴格根據」以下參考資料回答問題。
如果資料中沒有提及，請直接回答「文件中未提供」，切勿憑空捏造。
回答時必須在句末標註引用頁碼，格式為：(參照第 X 頁)。

【參考資料】：
[片段 1 - 第 12 頁]: 本年度公司負債總額為 1.2 億元...
[片段 2 - 第 25 頁]: 流動負債包含短期借款...

【提問】：本案的負債比率與流動負債狀況為何？


5. 地端 LLM 生成回答（Inference with Ollama Gemma）
目的： 讓 LLM 看著資料寫出結構化、閱讀體驗良好的分析回答。
做法： 將組裝好的 Prompt 送入地端 Ollama 的 Gemma 2 (2B 或 9B)。
參數設定建議：
temperature 設為 0.1（極低溫，防止模型自由發揮，降低幻覺）。
top_p 設為 0.9。
5 步驟落地實作架構
1. 文件讀取與切分 (Chunking)
避免長度過長與表格斷裂
使用 PyPDFLoader 載入 PDF，透過 RecursiveCharacterTextSplitter 切成 500~800 字的區塊，並保留頁碼 Metadata。
2. 向量化與向量庫儲存 (Embedding)
建置地端高維語意空間
呼叫地端 Embedding 模型（如 BGE-small-zh）將文字轉換為向量，並存入 ChromaDB/FAISS 資料庫。
3. 語意檢索 (Retrieval)
幾何距離相似度比對
將使用者的提問向量化，透過向量庫進行餘弦相似度搜尋，撈出 Top-K（如 3~5 個）最相關的文字片段。
4. 提示詞組合 (Prompt Assembly)
注入地端條款與約束
將「角色設定 + 要求標註頁碼 + 撈出的上下文片段 + 使用者問題」組合成完整 Prompt。
5. 地端模型推論 (Generation)
極低 Temperature 降低幻覺
送入 Ollama Gemma 生成答案，強制模型只根據參考片段回答並附帶引用頁碼。

# 執行 RAG

<!--RAG2
這是一個非常標準且實用的金融地端 RAG（檢索增強生成）實作範例。
在這個範例中，我們會使用 LangChain 搭配 PyPDFLoader（提取內文與頁碼）、ChromaDB（地端向量資料庫）以及 Ollama Gemma。為了確保金融審查的嚴謹性，系統會透過精心設計的 Prompt 要求 Gemma 必須：
結構化輸出（條列風險項目與財務數據）。
標註引用頁碼（Citation），讓授信審查人員可以回到 PDF 逐筆核對。
系統架構與運作流程
[財報 PDF 檔] 
   │ 
   ▼ (PyPDFLoader 讀取，自動保留 metadata page 頁碼)
[帶有頁碼的文本區塊 (Chunks)]
   │
   ▼ (地端 Embedding 模型向量化，儲存至 ChromaDB)
[ChromaDB 向量資料庫]
   │
   ▼ (審查員提問："分析近兩年營運與財務風險，並標註頁碼")
[檢索出 Top-K 最相關頁碼段落] ──► [組合 Prompt] ──► [Ollama Gemma 地端模型]
                                                         │
                                                         ▼
                                          [產出帶有引用頁碼的授信評估報告]


準備工作：環境安裝
在執行 Python 程式碼前，請先確保環境已安裝相關套件，且 Ollama 已在背景執行並下載好 Gemma：
# 1. 下載並運行 Ollama Gemma 2 (建議 2B 或 9B)
ollama run gemma2:2b

# 2. 安裝 Python 必備套件
pip install langchain langchain-community langchain-chroma pypdf sentence-transformers


完整 Python 實作程式碼
您可以直接建立一個 credit_underwriting_rag.py 檔案並執行：
import os
from langchain_community.document_loaders import PyPDFLoader
from langchain_text_splitters import RecursiveCharacterTextSplitter
from langchain_community.embeddings import HuggingFaceEmbeddings
from langchain_chroma import Chroma
from langchain_community.llms import Ollama
from langchain_core.prompts import PromptTemplate
from langchain_core.runnables import RunnablePassthrough
from langchain_core.output_parsers import StrOutputParser

# ---------------------------------------------------------------------------
# 1. 載入財報 PDF 並切分文本 (保留頁碼資訊 Metadata)
# ---------------------------------------------------------------------------
def load_and_split_pdf(pdf_path):
    print(f"正在讀取財報文件：{pdf_path} ...")
    loader = PyPDFLoader(pdf_path)
    documents = loader.load()
    
    # 針對金融文件的切分設定：建議區塊不要太小，避免財務表格被切碎
    text_splitter = RecursiveCharacterTextSplitter(
        chunk_size=600,
        chunk_overlap=100,
        add_start_index=True
    )
    chunks = text_splitter.split_documents(documents)
    print(f"文件讀取完成！共切分為 {len(chunks)} 個文本區塊 (Chunks)。")
    return chunks


# ---------------------------------------------------------------------------
# 2. 建立地端向量資料庫 (ChromaDB + HuggingFace Embedding)
# ---------------------------------------------------------------------------
def build_vector_store(chunks):
    print("正在建立地端 Embedding 向量庫...")
    # 使用多語言適用的繁體中文/英文輕量 Embeddings 模型（完全在地端執行，零雲端開銷）
    embeddings = HuggingFaceEmbeddings(
        model_name="BAAI/bge-small-zh-v1.5"
    )
    
    # 建立記憶體型的 ChromaDB (若需持久化儲存，可填入 persist_directory)
    vector_store = Chroma.from_documents(
        documents=chunks,
        embedding=embeddings,
        collection_name="credit_financial_reports"
    )
    print("向量資料庫建置完成！")
    return vector_store


# ---------------------------------------------------------------------------
# 3. 格式化檢索結果：將內文與頁碼組合給 Prompt
# ---------------------------------------------------------------------------
def format_docs_with_pages(docs):
    formatted_chunks = []
    for doc in docs:
        # PyPDFLoader 會自動在 metadata 中填入 page 號碼 (預設從 0 開始，因此 +1 轉為實際頁碼)
        page_num = doc.metadata.get("page", 0) + 1
        content = doc.page_content.replace("\n", " ")
        formatted_chunks.append(f"[參考頁碼：第 {page_num} 頁]\n內容：{content}")
    
    return "\n\n-------------------------\n\n".join(formatted_chunks)


# ---------------------------------------------------------------------------
# 4. 主程式：構建 LangChain RAG 鏈與 Ollama Gemma
# ---------------------------------------------------------------------------
def main():
    # 替換為您欲測試的財報 PDF 路徑 (例如：上市公司的年報或財務說明書)
    pdf_file_path = "sample_financial_report.pdf"
    
    if not os.path.exists(pdf_file_path):
        print(f"提示：請將範例財報檔案放至當前目錄並命名為 '{pdf_file_path}' 後再執行。")
        return

    # 執行文檔載入與向量化
    chunks = load_and_split_pdf(pdf_file_path)
    vector_store = build_vector_store(chunks)
    
    # 建立 Retriever (檢索前 Top-4 最相關的頁碼區塊)
    retriever = vector_store.as_retriever(search_kwargs={"k": 4})

    # 初始化地端 Ollama Gemma 模型
    print("初始化地端 Ollama Gemma 模型...")
    llm = Ollama(model="gemma2:2b", temperature=0.1) # 低 Temperature 可降低模型幻覺

    # 專門為金融授信審查設計的 Prompt 樣板
    system_prompt_template = """你是一位專業的銀行金融授信審查專員（Credit Risk Officer）。
請嚴格根據底下提供的【參考文件內容】進行分析，回答審查提問。

【審查與回答原則】：
1. 你的任務是找出企業潛在的「財務風險、負債狀況、流動性危機或營運異常」。
2. 每一條分析與提出的風險點，都【必須】在句末明確註明出處頁碼，格式為：(參照第 X 頁)。
3. 如果參考文件中沒有提到相關數據，請直接回答：「文件中未提供相關資訊，無法評估。」，切勿憑空捏造。

【參考文件內容】：
{context}

【授信審查提問】：
{question}

【授信審查初步評估報告】：
"""

    prompt = PromptTemplate.from_template(system_prompt_template)

    # 建立 LangChain LCEL 鏈結 (Chain)
    rag_chain = (
        {
            "context": retriever | format_docs_with_pages,
            "question": RunnablePassthrough()
        }
        | prompt
        | llm
        | StrOutputParser()
    )

    # 模擬授信審查人員的提問
    query = "請摘要這家公司的主要財務風險（例如負債率、現金流或短期償債能力），並逐條標註引用頁碼。"
    
    print("\n" + "="*50)
    print(f"審查人員提問：{query}")
    print("="*50 + "\n")
    print("Gemma 地端模型分析中...\n")

    # 執行 RAG 生成報告
    response = rag_chain.invoke(query)
    
    print(response)

if __name__ == "__main__":
    main()

<!-- Fine Tuning

步驟二：完整微調程式碼 (train_gemma.py)
您可以直接複製並執行這份腳本：
import torch
from unsloth import FastLanguageModel
from datasets import Dataset
from trl import SFTTrainer
from transformers import TrainingArguments

# ---------------------------------------------------------------------------
# 1. 設定參數與載入 4-bit 量化的 Gemma 2 (2B) 模型
# ---------------------------------------------------------------------------
max_seq_length = 512  # 限制上下文長度以大幅節省 VRAM
dtype = None          # 自動偵測 (Float16 或 Bfloat16)
load_in_4bit = True   # 開啟 4-bit 量化，記憶體佔用小於 3GB

print("正在載入 Gemma 2 2B 模型...")
model, tokenizer = FastLanguageModel.from_pretrained(
    model_name = "unsloth/gemma-2-2b-it-bnb-4bit",
    max_seq_length = max_seq_length,
    dtype = dtype,
    load_in_4bit = load_in_4bit,
)

# ---------------------------------------------------------------------------
# 2. 為模型掛載 QLoRA 外掛層 (只微調約 1%~2% 的參數)
# ---------------------------------------------------------------------------
model = FastLanguageModel.get_peft_model(
    model,
    r = 16,                  # LoRA 秩 (Rank)
    target_modules = ["q_proj", "k_proj", "v_proj", "o_proj",
                      "gate_proj", "up_proj", "down_proj"],
    lora_alpha = 16,
    lora_dropout = 0,        # 0 代表最佳化加速
    bias = "none",
    use_gradient_checkpointing = "unsloth", # 節省 VRAM 的關鍵
    random_state = 3407,
)

# ---------------------------------------------------------------------------
# 3. 準備「金融新聞/筆記 -> 金融 JSON」的模擬訓練資料
# ---------------------------------------------------------------------------
# 定義 Prompt 樣板 (Instruction 格式)
prompt_style = """以下是一段非結構化的金融文字，請提取出關鍵資訊，並嚴格以 JSON 格式輸出。

### 輸入：
{}

### 輸出 JSON：
{}"""

# 範例訓練資料 (實際應用時可準備 100 ~ 1,000 筆)
raw_data = [
    {
        "input": "護國神山台積電（2330）今日公告最新財報，第3季合併營收約為6,500億元，稅後純益達2,100億元，年增率達15%。營業利益率回升至42%，整體表現優於市場預期。",
        "output": '{"company_name": "台積電", "stock_code": "2330", "revenue_billion": 6500, "net_profit_billion": 2100, "revenue_growth_yoy": "15%", "sentiment": "Bullish"}'
    },
    {
        "input": "國泰金控發布重訊，受避險成本飆升影響，旗下人壽子公司單月虧損 12 億元，導致金控單月獲利年減 35%，淨值比降至 4.5%，避險情緒顯著上升。",
        "output": '{"company_name": "國泰金控", "stock_code": null, "revenue_billion": null, "net_profit_billion": -12, "revenue_growth_yoy": "-35%", "sentiment": "Bearish"}'
    },
    {
        "input": "聯發科（2454）於法說會表示，受到天璣 9300 晶片熱銷帶動，第四季營收預估落於 1,200 億至 1,260 億元之間，季增 9% 至 15%，毛利率維持在 47% 左右。",
        "output": '{"company_name": "聯發科", "stock_code": "2454", "revenue_billion": 1230, "net_profit_billion": null, "revenue_growth_yoy": null, "sentiment": "Bullish"}'
    }
]

# 格式化資料集
def format_prompts(examples):
    inputs = examples["input"]
    outputs = examples["output"]
    texts = []
    for input_text, output_text in zip(inputs, outputs):
        text = prompt_style.format(input_text, output_text) + tokenizer.eos_token
        texts.append(text)
    return { "text" : texts }

dataset = Dataset.from_list(raw_data)
dataset = dataset.map(format_prompts, batched = True)

# ---------------------------------------------------------------------------
# 4. 配置訓練器 (SFTTrainer) 並開始微調
# ---------------------------------------------------------------------------
trainer = SFTTrainer(
    model = model,
    tokenizer = tokenizer,
    train_dataset = dataset,
    dataset_text_field = "text",
    max_seq_length = max_seq_length,
    dataset_num_proc = 2,
    packing = False, # 範例簡單不使用 packing
    args = TrainingArguments(
        per_device_train_batch_size = 1,      # 單張顯卡 Batch Size 設為 1 避免 OOM
        gradient_accumulation_steps = 4,      # 搭配 4 步梯度累積
        warmup_steps = 2,
        max_steps = 15,                       # 範例僅訓練 15 步做測試 (正式可設 60~100)
        learning_rate = 2e-4,                 # 微調標準學習率
        fp16 = not torch.cuda.is_bf16_supported(),
        bf16 = torch.cuda.is_bf16_supported(),
        logging_steps = 1,
        output_dir = "outputs",
    ),
)

print("開始訓練 Gemma 2 模型...")
trainer.train()

# ---------------------------------------------------------------------------
# 5. 測試微調後的模型 (Inference)
# ---------------------------------------------------------------------------
FastLanguageModel.for_inference(model) # 開啟推理優化

test_news = "長榮海運（2603）受紅海危機影響，貨櫃運價大幅飆漲，公布最新單月營收達 285 億元，創近 10 個月新高，年增 12%。"

prompt_input = prompt_style.format(test_news, "")
inputs = tokenizer([prompt_input], return_tensors = "pt").to("cuda")

print("\n" + "="*50)
print("測試輸入：", test_news)
print("="*50)

outputs = model.generate(**inputs, max_new_tokens = 150, use_cache = True)
result = tokenizer.batch_decode(outputs)

# 截取輸出結果
print("\n模型微調後產出的 JSON：")
print(result[0].split("### 輸出 JSON：\n")[1].replace(tokenizer.eos_token, ""))


步驟三：匯出模型供 Ollama 使用（選用）
Unsloth 最便利的功能之一，就是可以直接將微調好的模型導出成 .gguf 檔案，讓您匯入地端 Ollama：
# 將微調好的 LoRA 權重合併並導出為 4-bit 量化的 GGUF 檔
model.save_pretrained_gguf("gemma_financial_json", tokenizer, quantization_method = "q4_k_m")


產出 gemma_financial_json-unsloth.Q4_K_M.gguf 後，只需寫一張 Modelfile 就能直接在 Terminal 執行 ollama run 了！
程式碼重點剖析（給學生的避坑知識）
load_in_4bit = True： 載入時就進行 4-bit 量化，將原先需 5GB+ VRAM 的 Gemma 2B 壓縮到 2.2GB VRAM 左右。
per_device_train_batch_size = 1 + gradient_accumulation_steps = 4： 這是在個人顯卡（8GB VRAM）上微調不爆顯存的核心技巧。
max_seq_length = 512： 訓練時將序列長度限制在 512，避免 Transformer 注意力矩陣佔據過多動態 VRAM。
