"課程簡介":["本課程將帶領同學從「學習智慧」與「運⽤智慧進⾏推論」的觀點出發，探討⼈⼯智慧的發展脈絡。課程內容涵蓋從 ANI（弱⼈⼯智慧）、AGI（通⽤⼈⼯智慧）到 ASI（超級⼈⼯智慧）的歷史演進與未來展望，並深⼊解析 DIKW（資料、資訊、知識、智慧）⾦字塔架構，引導同學反思「智慧」的本質與定義。","隨著理解⼈類如何從觀察中歸納規則、發掘智慧的歷程，同學不僅能認識創造智能的⽅法與演進，更將培養正確使⽤「⽣成式⼈⼯智慧（Generative AI）」的核⼼素養——在追求效率的同時，仍能保持主體性，成為⽣活的主⼈，並精準掌控這項強⼤的⼯具。此外，本課程亦將輔導同學考取 TQC ⽣成式⼈⼯智慧應⽤能⼒鑑定證照，並⿎勵且指導同學組隊參加 Coding 101 ⼤學程式設計競賽，將商務創意發想付諸實現。"],
"Brief Introduction":["This course explores the evolution of artificial intelligence through the lenses of \"acquiring intelligence\" and \"applying intelligence for reasoning.\" Covering the historical trajectory and future expectations from ANI (Artificial Narrow Intelligence) and AGI (Artificial General Intelligence) to ASI (Artificial Superintelligence), the curriculum introduces the DIKW (Data, Information, Knowledge, Wisdom) hierarchy to guide students in reflecting on the true essence of \"intelligence.\"","By examining how humans induce rules from observations and uncover intellectual processes, students will not only understand the methodology and evolution of creating intelligence, but also cultivate the essential literacy to utilize Generative AI effectively. The course empowers students to harness this powerful tool with precise control, enhancing efficiency while remaining the masters of their own lives. Furthermore, this course provides official guidance for the TQC Generative AI Certification and actively encourages students to participate in the Coding 101 Competition to pitch and develop their innovative business ideas."],
