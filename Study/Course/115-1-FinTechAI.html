"課程簡介":["本課程專為財金系學生設計，旨在培養「AI 時代的科技金融人才」。課程採取「雙週雙軌制」，每大主題皆兼顧財金商業邏輯與 Python 工具實作。內容涵蓋機器人理財、貸款風控模型、信用卡盜刷偵測、財經新聞輿情分析，更與時俱進導入生成式 AI (LLM) 與財報自動化解讀技術。本課程著重於 AI 工具的實務應用與商業決策，而非底層演算法推導，旨在協助學生將財金專業與人工智慧完美結合，掌握前瞻的 FinTech 實務核心能力。"],

<!--
教學目標：
1. 金融業務與商業模式解構能力：深入理解銀行放款、金融商品銷售及手續費服務等核心業務之運作機制與獲利結構，並具備剖析作業痛點與數據需求的實務能力。
2. 人工智慧與演算法技術對接能力：掌握預測、分類、分群與生成等四類核心智能任務，並能靈活對接機器學習、序列對序列（Seq2Seq）與生成式 AI 技術於具體金融應用場景。
3. 雙沙盒機制與合規約束整合思維：建立「數位沙盒（技術驗證）」與「金融監理沙盒（商業落地）」之雙軌思維，在個人資料保護、演算法可解釋性與風險隔離之法遵框架下進行金融創新。
4. 永續金融與前沿主題評估能力：結合 ESG 與永續金融發展趨勢，學會運用 AI 技術評估企業永續風險、信用價值與資產估價，拓展創新視野。
5. 沙盒專案實踐與原型設計能力：透過「修課成績代幣沙盒」實務專題，全程參與構想設計、合規評估與代幣經濟模型驗證，具備兼具商業價值與技術可行性之綜合提案實力。

教材大綱：

金融科技雙沙盒機制與創新驗證
	說明由官方或周邊單位建置之數位沙盒如何提供去識別化金融數據與測試環境以驗證 AI 模型之技術可行性
	說明金融監理沙盒如何透過法規豁免機制與風險控管措施協助創新金融服務進行真實市場之商業可行性測試
	剖析創新提案由數位沙盒之技術概念驗證遞進至監理沙盒之商業服務驗證之雙軌協同發展路徑
	探討沙盒機制中關於個人資料保護與消費者權益保障等金融監理紅線對 AI 應用開發之約束與規範

人工智慧核心任務類型與演算法應用
	介紹機器學習於金融預測任務中之數值型目標與時間序列預測模型架構
	說明金融分類任務於信用違約預測與異常
	交易偵測以及核貸通過率之演算法應用
	剖析非監督式學習於客戶分群與客群特徵萃取以及市場細分之演算法應用
	探討生成式人工智慧與序列對序列模型於金融文本生成與數據合成以及對話互動之應用場景

信用風險管理與放款業務智慧化
	評估申貸事前階段運用多源數據鑑定申貸人與關係人還款能力之智慧評估機制
	設計申貸事後階段運用即時監控數據鑑定債務違約風險與預警機制
	分析傳統信用評分模型與機器學習放款審核模型之精準度比較與合規審查
	探討自動化核貸流程中關於演算法可解釋性與偏見防範之監理要求

資產價值估算與信用鑑定機制
	介紹金融資產與擔保品以及非結構化數據之價值鑑定方法與估價模型
	說明個人與企業信用風險之多維度量化鑑定指標與評估技術
	剖析機器學習於信用風險定價與動態利率調整機制之應用邏輯
	探討鑑定模型於市場極端波動下之穩健性測試與降級運作機制

金融商品銷售與財富管理服務
	剖析投資與財富管理以及保險等金融商品之個性化推薦與適配性評估模型
	探討國債與公債市場之數據分析與投資組合優化演算法應用
	說明中央存款保險機制於金融體系風險隔離與存款人權益保障之角色
	分析智慧理財諮詢與自動化資產再平衡技術之商業模式與法規限制

支付服務與手續費商業模式創新
	梳理消費金融與支付清算以及跨國匯款等金融服務之作業流程與手續費結構
	探討數據驅動之金融情報萃取與客戶生命週期價值評估模型
	分析手續費收益導向型金融服務中導入人工智慧提升轉換率之策略
	評估金融服務流程自動化對降低營運成本與提升用戶體驗之實質效益

永續金融與綠色科技應用
	介紹環境與社會及公司治理（ESG）數據於金融風險評估與放款審核之整合應用
	說明綠色金融商品與碳金融資產之評鑑與認證及監測技術
	剖析利用人工智慧處理非結構化永續報告書以進行企業漂綠風險識別之方法
	探討永續金融監理規範與國際資訊揭露標準對金融機構作業流程之影響

課程修課成績代幣沙盒實務專題
	設計以課程修課成績代幣為核心之沙盒實務專題實驗環境與代幣經濟模型
	整合金融業務需求與人工智慧技術構想並於課程沙盒中進行模擬發行與交易驗證
	評估專案於代幣機制設計中關於隱私保護與風險隔離以及法遵合規之邊界約束
	執行創新專案之成果展示與金融專家模擬審查並評估營運可行性與技術完整度

授課形式分析	理論講述與討論	70%
授課形式分析	個案分析或作品賞析	10%
授課形式分析	行動實作與報告	20%
-->
