"課程簡介":["本課程專為財金系學生設計，旨在培養「AI 時代的科技金融人才」。課程採取「雙週雙軌制」，每大主題皆兼顧財金商業邏輯與 Python 工具實作。內容涵蓋機器人理財、貸款風控模型、信用卡盜刷偵測、財經新聞輿情分析，更與時俱進導入生成式 AI (LLM) 與財報自動化解讀技術。本課程著重於 AI 工具的實務應用與商業決策，而非底層演算法推導，旨在協助學生將財金專業與人工智慧完美結合，掌握前瞻的 FinTech 實務核心能力。"],
"Brief Introduction":["Tailored specifically for finance students, this course aims to cultivate tech-savvy financial professionals for the AI era. Adopting a dual-track, bi-weekly structure, each core topic seamlessly integrates financial business logic with hands-on Python implementation. The curriculum covers robo-advisors, credit risk scoring, credit card fraud detection, and financial sentiment analysis, while staying ahead of the curve by introducing Generative AI (LLM) and automated financial statement analysis.\nEmphasizing practical tool application and business decision-making over low-level algorithm derivation, this course empowers students to bridge financial expertise with AI, mastering the core competencies driving modern FinTech innovations."],
