<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CCD 監控與資訊介面</title>
    <style>
        /* --- 基本與佈局 --- */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed; /* 讓儲存格等寬 */
        }
        td {
            vertical-align: top;
            padding: 20px;
            border: 1px solid #ddd;
            background-color: #fff;
            height: 80vh; /* 讓介面有足夠高度 */
        }

        /* --- 視訊區域 --- */
        .video-container {
            border: 1px solid #ccc;
            border-radius: 8px;
            padding: 15px;
            background: #fdfdfd;
        }
        #video-stream {
            width: 100%;
            background-color: #000;
            border: 1px solid #444;
            min-height: 360px; /* 保持一個最小高度 */
        }
        .video-controls {
            margin-top: 15px;
            text-align: center;
        }
        .video-controls button {
            padding: 10px 18px;
            margin: 0 5px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            background-color: #007bff;
            color: white;
            transition: background-color 0.3s;
        }
        .video-controls button:hover {
            background-color: #0056b3;
        }

        /* --- Tab 切換介面 --- */
        .tab-container {
            width: 100%;
        }
        .tab-buttons {
            overflow: hidden;
            border-bottom: 2px solid #ccc;
        }
        .tab-buttons button {
            background-color: inherit;
            float: left;
            border: none;
            outline: none;
            cursor: pointer;
            padding: 14px 20px;
            transition: 0.3s;
            font-size: 17px;
            border-top-left-radius: 5px;
            border-top-right-radius: 5px;
        }
        .tab-buttons button:hover {
            background-color: #ddd;
        }
        .tab-buttons button.active {
            background-color: #ccc;
            font-weight: bold;
            border-bottom: 2px solid #007bff;
        }
        .tab-content {
            display: none; /* 預設隱藏所有內容 */
            padding: 15px 12px;
            border: 1px solid #ccc;
            border-top: none;
            min-height: 380px; /* 保持一個最小高度 */
            background-color: #fdfdfd;
        }
        .tab-content.active {
            display: block; /* 僅顯示 active 的內容 */
        }
    </style>
</head>

<body>
    <table>
        <tr>
            <td>
                <div class="video-container">
                    <h3>CCD 視訊畫面</h3>
                    
                    <video id="video-stream" controls autoplay playsinline muted>
                        您的瀏覽器不支援 HTML5 video 標籤。
                    </video>
                    
                    <div class="video-controls">
                        <button id="start-video">開始視訊</button>
                        <button id="stop-video">停止視訊</button>
                        <button id="snapshot">擷取快照</button>
                    </div>
                </div>
            </td>
            <td>
                <div class="tab-container">
                    <div class="tab-buttons">
                        <button class="tab-link active" onclick="openTab(event, 'Info1')">資訊一</button>
                        <button class="tab-link" onclick="openTab(event, 'Info2')">資訊二</button>
                        <button class="tab-link" onclick="openTab(event, 'Info3')">資訊三</button>
                    </div>

                    <div id="Info1" class="tab-content active">
                        <h3>資訊一：即時數據</h3>
                        <p>這裡是顯示即時數據的地方...</p>
                        <p>例如：溫度、壓力、流量等。</p>
                    </div>

                    <div id="Info2" class="tab-content">
                        <h3>資訊二：系統日誌</h3>
                        <p>這裡是顯示系統日誌的地方...</p>
                        <pre>
2025-11-04 10:30:01 - 系統啟動
2025-11-04 10:30:05 - CCD 鏡頭連接成功
2025-11-04 10:31:00 - 開始擷取
                        </pre>
                    </div>

                    <div id="Info3" class="tab-content">
                        <h3>資訊三：參數設定</h3>
                        <p>這裡是顯示參數設定的地方...</p>
                        <form>
                            <label for="exposure">曝光時間 (ms):</label>
                            <input type="number" id="exposure" name="exposure" value="100">
                            <br><br>
                            <label for="gain">增益 (dB):</label>
                            <input type="number" id="gain" name="gain" value="5">
                            <br><br>
                            <button type="button">套用設定</button>
                        </form>
                    </div>
                </div>
            </td>
        </tr>
    </table>

    <script>
        function openTab(evt, tabName) {
            // 宣告所有需要的變數
            var i, tabcontent, tablinks;

            // 1. 取得所有 class="tab-content" 的元素，並隱藏它們
            tabcontent = document.getElementsByClassName("tab-content");
            for (i = 0; i < tabcontent.length; i++) {
                tabcontent[i].style.display = "none";
                tabcontent[i].classList.remove("active");
            }

            // 2. 取得所有 class="tab-link" 的元素，並移除 "active" class
            tablinks = document.getElementsByClassName("tab-link");
            for (i = 0; i < tablinks.length; i++) {
                tablinks[i].classList.remove("active");
            }

            // 3. 顯示當前點擊的 tab 內容，並將該按鈕設為 "active"
            document.getElementById(tabName).style.display = "block";
            document.getElementById(tabName).classList.add("active");
            evt.currentTarget.classList.add("active");
        }
    </script>
</body>
</html>
