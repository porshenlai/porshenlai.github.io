	<style>
		html, body {
			width:100%; height:100%; border:0; margin:0; padding:0; overflow:hidden;
		}
		body { 
			overflow-y:auto;
			background:black url('https://porshenlai.github.io/res/cyberpiers.jpg') no-repeat center center/cover;
			color:white;
		}
		div[page] {
			position:absolute; overflow:hidden;
			left:0; top:0; right:0; bottom:0;
			text-shadow: -1px -1px 0 orange, 1px -1px 0 orange, -1px 1px 0 orange, 1px 1px 0 orange;
		}
		div[page] [onclick] { border:1px solid grey; }
		div[page] [onclick]:hover { border:1px solid gold; }
		div[page] td {
			background:rgba(0,0,0,0.5);
			vertical-align:middle;
			text-align:center;
			font-size:6vmin;
			text-shadow:2px 1px lightblue;
		}
		h1,h2,h3 { margin-left:8px; }
		.hidden { display:none; }
		.ctlist { width:100%;display:flex;flex-flow:row wrap;justify-content:flex-start;align-items:center;}
		.ctlist>div { flex:1 0 auto; margin:0.5%; padding:1%; }
		@media (orientation: landscape) {
			.ctlist>div { width:40%; max-width:47%; }
		}
		@media (orientation: portrait) {
			.ctlist>div { width:80%; max-width:97%; }
		}
	</style>
	<script>
		function goto (target) {
			Array.from(document.body.querySelectorAll(`div[page]`))
			.forEach(
				(pe) => pe.classList[pe.getAttribute("page")===target?"remove":"add"]("hidden"));
		}
		function play (target) {
			window.open(target);
		}
	</script>
</head>
