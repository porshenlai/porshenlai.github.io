💻 AI-900 模擬試題 (電腦視覺基礎) OCR 與解析

1. 請問哪一個電腦視覺功能可以為數位相片產生**「自動標題」**?

> 解析： 描述影像（或稱影像標註/Image Captioning）是產生人類可讀的自然語言描述 (標題) 的功能。

26. Azure AI 自訂視覺模型如果可從共 100 張包含柳橙的影像中，正確識別 70 張包含柳橙的影像。表示產生 70\% 何者的計量?
 * ① 平均精確率
 * ② 精確率
 * ③ 召回率
> ❗ 注意與解析：
>  * 召回率 (Recall)：模型正確識別的正樣本數佔所有實際正樣本數的比例 \rightarrow \frac{\text{TP}}{\text{TP} + \text{FN}}。
>  * 在這個簡化情境中 (100 張都是柳橙)，「正確識別 70 張」 可以被解釋為 召回率 (因為所有 100 張影像都是實際的正樣本，模型找回了 70 個)。
>
