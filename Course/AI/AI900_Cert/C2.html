一、判斷題 (請輸入「是」或「否」)

|---|---|---|
| 您使用未標記的資料定型迴歸模型。 | 否 | 迴歸是監督式學習，必須使用標記的資料集 (即有特徵和標籤)。 |
| 分類技術用來預測一段時間後的連續數值。 | 否 | 預測連續數值是迴歸；分類是用來預測類別/類別標籤。 |
| 依共同特性分組項目為叢集範例。 | 是 | 叢集 (Clustering) 是非監督式學習，目的是根據相似性將資料點分組。 |

|---|---|---|

二、選擇題 (單選與多選)
4. 下列哪個模型可用以預測拍賣品售價?
 * ① 分類
 * ② 迴歸 (正確)
 * ③ 叢集
> 解析： 售價是一個連續數值，因此使用迴歸模型。
> 
5. 您該使用哪種機器學習類型預測下個月售出的禮品卡數量?
 * ① 分類
 * ② 迴歸 (正確)
 * ③ 叢集
> 解析： 數量是一個數值，因此使用迴歸模型。
> 
6. 您需要預測某個區域的動物族群規模。您應該使用下列哪一種 Azure Machine Learning 類型?
 * ① 分類
 * ② 迴歸 (正確)
 * ③ 叢集
> 解析： 族群規模是一個數值，因此使用迴歸模型。
> 
7. 您想預測某國家公園內動物的數量，應該使用下列哪種類型的 Azure Machine Learning 模型類型?
 * ① 分類
 * ② 迴歸 (正確)
 * ③ 叢集
> 解析： 數量是一個數值，因此使用迴歸模型。
> 
8. 您想找出具有相似購物習慣的人員族群，該使用下列哪種機器學習類型?
 * ① 分類
 * ② 迴歸
 * ③ 叢集 (正確)
> 解析： 找出相似性並分群是叢集模型的應用。

10. 您需要使用以下資料集來預測指定客戶的收入範圍，應該將下列哪兩個欄位用作特徵? (多選)

 * ② 姓氏
 * ③ 教育程度 (正確)
 * ④ 收入範圍
 * ⑤ 年齡 (正確)
> 解析：
>  * 標籤 (Label) 是「收入範圍」 (預測目標)。
>  * 特徵 (Feature) 是用來預測收入範圍的輸入變數，通常是與收入相關的資訊，例如年齡和教育程度。
>  * 名字/姓氏通常不是預測模型的有效特徵。
> 
11. 您計劃使用下面資料集，訓練一個預測房價類別的模型。請問家庭收入和房價類別分別屬於下列何者?
 * A. 家庭收入: ① 特徵 (功能) (正確)
 * B. 房價類別: ② 標籤 (正確)
> 解析：
>  * 家庭收入：用來預測房價類別的輸入變數 \rightarrow 特徵。
>  * 房價類別：模型要預測的目標變數 \rightarrow 標籤。
> 
12. 關於機器學習的過程，應如何分割用於訓練和評估的資料?
 * ① 用特徵進行訓練，標籤則用來進行評估。
 * ② 用標籤進行訓練，特徵則用來進行評估。
 * ③ 將資料隨機分割為訓練資料行和評估資料行。
 * ④ 將資料隨機分割為訓練資料列和評估資料列。 (正確)
> 解析： 訓練和評估資料應從原始資料集的資料列 (樣本/記錄) 中隨機抽取，以確保兩組資料能代表整體。
> 
15. 應該如何使用 Azure Machine Learning 設計工具建立叢集模型並評估該模型?
 * ① 將原始資料集分割成特徵和標籤資料集，使用特徵資料集進行評估。
 * ② 將原始資料集分割成定型和測試資料集，使用測試資料集進行評估。 (正確)
 * ③ 將原始資料集分割成定型和測試資料集，使用定型資料集進行評估。
 * ④ 使用原始資料集進行定型和評估。
> 解析： 無論是監督式 (分類/迴歸) 還是非監督式 (叢集) 模型，標準流程都是：將資料分割為訓練集和測試集 (或稱驗證集)，用訓練集定型模型，用測試集評估模型效能。
> 
16. 使用 Azure Machine Learning 設計工具發佈推斷管線時，您應該使用下列哪兩個參數來存取 Web 服務? (多選) 
 * ① 模型名稱
 * ② REST 端點 (正確)
 * ③ 驗證金鑰 (正確)
 * ④ 定型端點
> 解析： 部署為 Web 服務後，外部應用程式需要知道服務的 REST 端點 URL 和用於安全連線的 驗證金鑰 (或 token) 才能呼叫。
> 
18. 您有一個資料集，其中包含指定時間內發生的計程車行程訊息。您需要訓練一個模型來預測計程車行程的費用，應該用什麼選項作為特徵?
 * ① 各計程車行程的車費
 * ② 各計程車行程的單程距離 (正確)
 * ③ 資料集中的計程車行程數
 * ④ 各計程車行程的單程 ID
> 解析：
>  * 標籤 (Label) 是「車費」 (預測目標)。
>  * 特徵 (Feature) 是用來預測車費的輸入變數，其中單程距離通常與車費呈正相關。
> 
19. 使用上次的消費日期、消費頻率、消費金額 (RFM) 值，來識別客戶群中的客層，為下列何種機器學習模型的範例?
 * ① 分類
 * ② 迴歸
 * ③ 叢集 (正確)
 * ④ 正規化
> 解析： 識別客戶群或區隔客層是根據相似的消費行為進行分群，這是叢集模型的典型應用。
> 
20. 想要使用 Azure Machine Learning 設計工具部署機器學習模型，您應依序執行下列哪四項動作? (請將適當的動作按照正確順序排列)
 * ① 載入及準備資料集
 * ⑤ 將資料隨機分割為訓練資料與驗證資料
 * ② 定型模型
 * ③ 對驗證資料集評估模型
 * ④ 對原始資料集評估模型 (錯誤)
> 正確順序：
>  * 載入及準備資料集
>  * 分割資料 (訓練/驗證)
>  * 定型模型
>  * 評估模型 (使用驗證/測試集)
> 
21. 在 Azure Machine Learning 設計工具中，您可以使用下列何者，以探索潛在特徵資料行中值的分佈。
 * ① Normalize Data (正常化資料) 模組
 * ② Select Columns in Dataset (選取資料集中的資料行) 模組
 * ③ 資料集輸出視覺化特徵 (正確)
 * ④ 評估結果視覺化特徵
> 解析： 在 Designer 中，右鍵點擊資料集模組的輸出並選擇「視覺化」，可以查看資料集的統計摘要和資料行中值的分佈，這對特徵探索至關重要。
> 
22. 您必須利用現有的資料集建立訓練資料集和驗證資料集。您應該使用 Azure Machine Learning 設計工具的哪些模組?
 * ① 選取資料集中的資料行
 * ② 合併資料
 * ③ 分割資料 (Split Data) (正確)
 * ④ 新增資料列
> 解析： 分割資料 (Split Data) 模組專門用於將一個資料集劃分為兩個或多個子集，例如訓練集和測試/驗證集。
> 
23. 評估模型效能時，下列何者使用 0 和 1 值的網格顯示預測和實際的正負值。
 * ① AUC 計量
 * ② 混淆矩陣 (Confusion Matrix) (正確)
 * ③ ROC 曲線
 * ④ 閾值
> 解析： 混淆矩陣是一個表格，用於視覺化分類演算法的性能，它顯示了真陽性 (TP)、真陰性 (TN)、假陽性 (FP) 和假陰性 (FN) 的數量。
> 
24. 機器學習建立迴歸模型時，標籤應該使用哪種資料型別?

 * ② 日期時間
 * ③ 數值 (正確)
 * ④ 文字
> 解析： 迴歸模型的輸出（標籤）是連續數值。

25. 針對下列何者，您可使用資料集的其中一部分來準備機器學習模型並保持資料集平衡，以驗證結果。
 * ① 時間限制
 * ② 特徵工程
 * ③ MLflow 模型
 * ④ 模型定型 (正確)
> 解析： 模型定型 (Training) 和驗證 (Validation) 過程會使用到資料集的分割部分 (訓練集和驗證集)，並且需要確保資料集平衡。
>

 * ① 迴歸 (正確)
 * ② 分析
 * ③ 叢集

29. 您想要使用 Azure Machine Learning 自動化機器學習 (自動化 ML)、建置一個模型並加以訓練。您應該先建立下列哪一項?
 * ① Jupyter Notebook
 * ② 資料集 (正確)
 * ③ 已註冊的資料集
 * ④ Machine Learning 設計工具管線
> 解析： 無論使用 AutoML 或 Designer，訓練模型的第一步都是載入/建立用於訓練的資料集。
> 
30. 請問您應該採取什麼措施以減少機器學習分類模型所產生的誤判為真之數目?
 * ① 增加定型反覆運算的數目
 * ② 修改有利於錯誤否定的閥值 (正確)
 * ③ 修改有利於誤判為真的閥值
 * ④ 在定型資料中納入測試資料
> 解析：
>  * 誤判為真 (False Positive, FP)：實際為否，但模型預測為是。
>  * 要減少 FP，必須提高模型判斷為「是」的門檻 (閥值)，這樣會讓模型更「保守」，從而增加「誤判為否 (False Negative, FN)」（錯誤否定）的數量。因此，這個調整有利於錯誤否定。
> 
34. 您有一個資料集，包含銷售資料，並定義了標籤。您需要建立一個模型以根據銷售資料分類客戶類型。使用哪種機器學習類型?
