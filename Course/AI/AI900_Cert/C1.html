💻 AI-900 模擬試題 (AI 基礎與責任 AI) OCR 與解析
一、判斷題 (請輸入「是」或「否」)
5. 關於自然語言處理 (NLP) 的應用

| 監視線上服務的評論是否包含不雅用語為一項自然語言處理範例。 | 是 | 偵測不雅用語是文字分類或內容篩選的任務，屬於 NLP。 |

| 敘述 | 答案 | 補充說明 |

| 根據患者的病歷預測患者是否會罹患糖尿病為異常偵測範例。 | 否 | 這是分類模型的範例 (預測「是」或「否」)。 |
二、選擇題 (單選與多選)
1. 說明用以定型模型的資料來源是哪一項責任 AI 準則的範例?
 * ① 隱私權與安全性
 * ② 公平性
 * ③ 可靠性和安全性
 * ④ 透明度 (Transparency) (正確)
> 解析： 透明度要求 AI 系統應公開其目的、運作方式和訓練數據來源，以便使用者理解其局限性。
> 
2. 公司正在探索語音辨識技術在其智慧型家用裝置中的使用。公司想要找出可能無意間遺漏特定使用者群組的任何屏障。這是下列何者責任 AI 的 Microsoft 指導準則範例?
 * ① 權責
 * ② 公平性
 * ③ 隱私權與安全性
 * ④ 包容性 (Inclusiveness) (正確)
> 解析： 包容性旨在確保 AI 系統應考慮到人類的多樣性，消除潛在的排斥或障礙。
> 
3. 將 AI 工作負載類型與適當的案例進行配對。
| 工作負載類型 | 作答區 | 案例 |
|---|---|---|
| ④ 自然語言處理 | A. 回答退款及換貨問題的自動化聊天機器人 | 處理自然語言問答。 |
| ② 電腦視覺 | B. 判斷相片中是否有人物 | 處理影像內容。 |
| ④ 自然語言處理 | C. 判斷評論為正面或負面 | 情感分析，屬於 NLP。 |
4. AI 系統不應反映用於為訓練系統的資料集偏差，是下列哪個 Microsoft 責任 AI 的準則?
 * ① 權責性
 * ② 公平性 (Fairness) (正確)
 * ③ 包容性
 * ④ 透明度
> 解析： 公平性旨在防止 AI 系統對不同群體產生系統性偏差或不公平的結果。
> 
6. Microsoft 責任 AI 的指導準則是哪三項? (多選)
 * ① 決斷性
 * ④ 公平性 (Fairness) (正確)
 * ⑤ 包容性 (Inclusiveness) (正確)
 * ⑥ 可靠性和安全性 (Reliability and Safety) (正確)
> 解析： Microsoft 責任 AI 的六大準則為：公平性、包容性、可靠性和安全性、透明度、隱私權與安全性和權責性。
> 
7. 下列哪兩個案例是自然語言處理 (NLP) 工作負載範例? (多選)
 * ① 監控機器溫度，以在溫度達到特定閾值時打開風扇
 * ② 可以回答諸如「今天天氣如何?」等問題的家用智慧型裝置 (正確)
 * ③ 自動將車前燈插入汽車的生產線機械
 * ④ 使用知識庫以互動方式回答使用者問題的網站 (正確)
> 解析： 處理問題和回答、理解使用者輸入是 NLP 的核心應用。
> 
8. 您需要根據客戶在聊天機器人中鍵入的內容，偵測客戶何時感到沮喪。您應該使用下列哪一種類型的 AI 工作負載?
 * ① 迴歸
 * ② 自然語言處理 (NLP) (正確)
 * ③ 異常偵測
 * ④ 電腦視覺
> 解析： 偵測文字中的情緒（如沮喪）是 情感分析，屬於 NLP 工作負載。
> 
9. 貴公司想要打造瓶罐回收機。此回收機必須能夠自動識別正確形狀的瓶罐，拒收所有其他項目。公司應該使用哪種 AI 工作負載?
 * ① 自然語言處理
 * ② 電腦視覺 (Computer Vision) (正確)
 * ③ 知識採礦
 * ④ 異常偵測
> 解析： 識別影像中物體的形狀和類別是電腦視覺的任務（通常是影像分類或物件偵測）。
> 
10. 預測貸款是否償還的銀行系統是哪個類型的機器學習範例?
 * ① 分類 (Classification) (正確)
 * ② 叢集
 * ③ 迴歸
> 解析： 預測「是」（償還）或「否」（不償還）是預測離散類別，因此是分類。
> 
13. 當重要欄位包含不尋常或缺少值時，確保 AI 系統不會提供預測，是負責任 AI 的什麼準則?
 * ① 包容性
 * ② 隱私權與安全性
 * ③ 可靠性與安全性 (Reliability and Safety) (正確)
 * ④ 透明度
> 解析： 可靠性確保 AI 系統在所有情況下都能以一致且可靠的方式運行，包括在面對不完整的或異常的輸入時。
>

 * ① 電腦視覺工作負載
 * ② 知識採礦工作負載
 * ③ 自然語言處理 (NLP) 工作負載 (正確)
 * ④ 生成式 AI 工作負載
> 解析： 語音轉文字 (Speech-to-Text) 雖然涉及語音服務，但在 AI 工作負載類型中，它屬於自然語言處理領域（因為結果是文字/語言處理）。
>

 * ② 自然語言處理 (NLP) (正確)
 * ③ 電腦視覺
 * ④ 知識採礦
> 解析： 處理自然語言問句和理解問題意圖是 NLP 的應用。

 * ① 公平性
 * ② 可靠性和安全性 (Reliability and Safety) (正確)
 * ③ 權責性
 * ④ 包容性
> 解析： 可靠性和安全性準則強調 AI 系統在部署的整個生命週期中，必須持續且安全地運作。
> 
23. 從大量非結構化資料中擷取資料間的關聯性，是哪一種 AI 工作負載類型?

 * ② 電腦視覺
 * ③ 自然語言處理 (NLP)
 * ④ 異常偵測
> 解析： 知識採礦利用 AI 服務 (如認知搜索) 從非結構化內容中找到隱藏的洞察和關係。
> 
24. 在使用生成式 AI 的聊天解決方案中實作篩選以封鎖有害內容是 Microsoft 負責任 AI 準則的範例。
 * ① 權責性
 * ② 公平性
 * ③ 隱私權和安全性
 * ④ 透明度
> ❗ 注意與解析： 封鎖有害內容是為了確保 AI 系統的行為安全和可靠，因此主要與可靠性和安全性準則相關。然而，若要從選項中選擇，公平性和透明度都不直接相關。如果題目涉及內容安全，答案應為可靠性和安全性。

 * ④ Azure AI 文件智慧服務

 * ④ AI 系統應該保障開發人員的利益
> 解析： 隱私權與安全性是六大責任 AI 準則之一。
