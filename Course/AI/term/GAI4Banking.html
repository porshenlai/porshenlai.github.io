<p>金融監督管理委員會發布的「金融業應用人工智慧指引」（簡稱金管會 AI 指引）旨在<strong>推動金融業在安全、合規且負責任的前提下導入及運用 AI 技術</strong>。</p><p>該指引採<strong>行政指導</strong>性質，以<strong>六大核心原則</strong>和<strong>風險基礎方法</strong>為基礎。</p><p>以下是該指引的精簡摘要：</p><figure class="table"><table><thead><tr><th><strong>核心原則</strong></th><th><strong>目的與要求 (精簡)</strong></th><th><strong>關鍵詞彙</strong></th></tr></thead><tbody><tr><td><strong>1. 治理與問責機制</strong></td><td>建立明確的 AI 管理架構，<strong>指定高階主管負責</strong>，並對 AI 系統的內、外部影響承擔責任。</td><td>治理架構、高階主管問責、書面化紀錄。</td></tr><tr><td><strong>2. 公平性與以人為本</strong></td><td><strong>避免演算法偏見</strong>，確保 AI 服務對所有人都公平、非歧視。AI 系統的運用須符合<strong>人類可控</strong>原則。</td><td>避免偏見、公平待客、人類可控、最終判斷。</td></tr><tr><td><strong>3. 隱私保護與客戶權益</strong></td><td>應遵守<strong>資料最小化原則</strong>，保護客戶隱私。在運用 AI 服務時，<strong>應告知客戶</strong>，並<strong>提供替代方案或退出 AI 服務的選項</strong>。</td><td>資料最小化、隱私保護、客戶知情權、替代方案。</td></tr><tr><td><strong>4. 系統穩健性與安全性</strong></td><td>確保 AI 系統具有<strong>穩定性、準確性及可重製性（穩健性）</strong>，並具備足夠的<strong>資安防護能力（安全性）</strong>。對<strong>第三方 AI 服務業者</strong>需進行適當監督。</td><td>系統穩健性、資安防護、第三方監督、緊急關閉。</td></tr><tr><td><strong>5. 透明性與可解釋性</strong></td><td><strong>向外部利害關係人適當揭露</strong> AI 系統的相關資訊（透明性）。並能<strong>清楚說明 AI 系統運作邏輯及預測決策過程（可解釋性）</strong>。</td><td>適當揭露、運作邏輯、可解釋性程度。</td></tr><tr><td><strong>6. 促進永續發展</strong></td><td>鼓勵將 AI 發展策略與<strong>永續發展原則</strong>結合，兼顧社會公平、生態責任，並應<strong>培育數位人才</strong>。</td><td>永續發展、社會公平、人才培訓。</td></tr></tbody></table></figure><p><strong>特別強調：</strong></p><ul><li><strong>風險基礎方法：</strong> 金融機構應依據 AI 系統的風險高低，調整管理和稽核措施。</li><li><strong>生成式 AI (Generative AI)：</strong> 特別要求生成式 AI 的輸出資訊，<strong>必須由金融機構人員進行客觀且專業的風險管控和最終判斷</strong>。</li></ul>
