              "解釋": "設計精準有架構的問題，使 AI 生成符合架構的答案的技術。"
            },
            {
              "名稱": "AI 模型幻覺 (Hallucination)",
              "Tags": ["模型問題", "生成式AI"],
              "解釋": "生成式 AI 模型虛構與真實資訊混雜出現的內容，即使語句通順專業，但事實上提到的條文或企業名稱並不存在。"
            },
            {
              "名稱": "零信任架構 (Zero Trust Architecture)",
              "Tags": ["數據安全", "網路安全"],
              "解釋": "一種安全技術，最能確保數據使用的安全性，用於管理生成式 AI 系統的隱私風險。"
            },
            {
              "名稱": "偏差檢測 (Bias Detection)",
              "Tags": ["模型評估", "倫理合規"],
              "解釋": "在概念驗證 (POC) 時，用於確保模型生成的公平性的評估策略。"
            },
            {
              "名稱": "溫度 (Temperature)",
              "Tags": ["LLM", "參數調整"],
              "解釋": "控制大型語言模型生成內容隨機性（創意性）的參數。設定在 0.1 至 0.3 有助於降低回答的不確定性並提升一致性。"
            },
            {
              "名稱": "TTQA (Taiwanese Trivia Question Answering)",
              "Tags": ["LLM", "基準測試", "本土知識"],
              "解釋": "專門用於評估大型語言模型 (LLM) 在「台灣本土特有知識」方面表現的基準測試資料集。"
            },
            {
              "名稱": "結構化數據",
              "Tags": ["數據類型", "數據儲存"],
              "解釋": "通常指具備固定格式、易於搜尋和分析的數據，例如資料庫中的表格數據。"
            },
            {
              "名稱": "學習率 (Learning Rate)",
              "Tags": ["訓練優化", "超參數"],
              "解釋": "控制模型訓練時權重更新幅度的參數。"
            },
            {
              "名稱": "生成器 (Generator)",
              "Tags": ["GAN", "核心技術"],
              "解釋": "GAN 的一部分，負責生成接近真實數據的新樣本."
            },
            {
              "名稱": "鑑別器 (Discriminator)",
              "Tags": ["GAN", "核心技術"],
              "解釋": "GAN 的一部分，負責判斷輸入數據是真實數據還是生成器產生的假數據."
            },
            {
              "名稱": "超參數 (Hyperparameter)",
              "Tags": ["模型訓練", "參數調整"],
              "解釋": "在模型訓練前需手動設定的參數（如學習率、正則化係數）。"
            },
            {
              "名稱": "假陽性率 (False Positive Rate)",
              "Tags": ["模型評估", "指標"],
              "解釋": "將正常事件誤判為異常的比例。"
            }
          ]
        };

        const cardContainer = document.getElementById('flashcardContainer');
        const tagButtonsContainer = document.getElementById('tagButtons');
        let activeTags = new Set();
        let allTags = new Set();
        
        // 1. 收集所有獨特的 Tags
        jsonData['專有名詞分析'].forEach(item => {
            item.Tags.forEach(tag => allTags.add(tag));
        });

        // 2. 創建 Tag 過濾按鈕
        function createTagButtons() {
            // 創建 "全部" 按鈕
            const allButton = document.createElement('div');
            allButton.className = 'tag-button active';
            allButton.textContent = '全部';
            allButton.dataset.tag = 'all';
            allButton.addEventListener('click', toggleTagFilter);
            tagButtonsContainer.appendChild(allButton);

            // 創建其他 Tag 按鈕
            Array.from(allTags).sort().forEach(tag => {
                const button = document.createElement('div');
                button.className = 'tag-button';
                button.textContent = tag;
                button.dataset.tag = tag;
                button.addEventListener('click', toggleTagFilter);
                tagButtonsContainer.appendChild(button);
            });
        }

        // 3. 處理 Tag 按鈕點擊事件
        function toggleTagFilter(event) {
            const clickedButton = event.target;
            const tag = clickedButton.dataset.tag;
            const allButton = tagButtonsContainer.querySelector('[data-tag="all"]');

            if (tag === 'all') {
                // 點擊 "全部"
                if (activeTags.size === 0) return; // 已經是全部狀態則不動作

                activeTags.clear();
                tagButtonsContainer.querySelectorAll('.tag-button').forEach(btn => {
                    btn.classList.remove('active');
                });
                allButton.classList.add('active');
            } else {
                // 點擊其他 Tag
                if (clickedButton.classList.contains('active')) {
                    activeTags.delete(tag);
                    clickedButton.classList.remove('active');
                } else {
                    activeTags.add(tag);
                    clickedButton.classList.add('active');
                }

                // 移除 "全部" 的 active 狀態
                allButton.classList.remove('active');
                
                // 如果所有 Tag 都被移除，則自動切換到 "全部"
                if (activeTags.size === 0) {
                    allButton.classList.add('active');
                }
            }

            filterCards();
        }

        // 4. 根據當前選中的 Tag 過濾卡片
        function filterCards() {
            const cards = cardContainer.querySelectorAll('.flashcard');
            const showAll = activeTags.size === 0 || tagButtonsContainer.querySelector('[data-tag="all"]').classList.contains('active');

            cards.forEach(card => {
                const cardTags = card.dataset.tags.split(',');
                let shouldShow = showAll;

                if (!showAll) {
                    // 如果卡片包含任一個被選中的 Tag，則顯示
                    shouldShow = cardTags.some(tag => activeTags.has(tag));
                }

                if (shouldShow) {
                    card.classList.remove('hidden');
                } else {
                    card.classList.add('hidden');
                }
            });
        }

        // 5. 創建卡片 HTML
        function createFlashcards() {
            jsonData['專有名詞分析'].forEach(item => {
                // 創建卡片元素
                const card = document.createElement('div');
                card.className = 'flashcard';
                card.dataset.tags = item.Tags.join(','); // 將 Tags 存儲在 data 屬性中用於過濾

                // 點擊事件：切換 'flipped' class 來實現翻轉效果
                card.addEventListener('click', () => {
                    card.classList.toggle('flipped');
                });

                // 創建內部容器
                const inner = document.createElement('div');
                inner.className = 'flashcard-inner';

                // 創建正面 (名詞 + Tags)
                const front = document.createElement('div');
                front.className = 'flashcard-face flashcard-front';
                
                const termName = document.createElement('div');
                termName.className = 'term-name';
                termName.textContent = item['名稱'];
                front.appendChild(termName);

                const tagsList = document.createElement('div');
                tagsList.className = 'tags-list';
                tagsList.textContent = 'Tags: ' + item.Tags.join(' / ');
                front.appendChild(tagsList);


                // 創建背面 (解釋)
                const back = document.createElement('div');
                back.className = 'flashcard-face flashcard-back';
                
                const explanation = document.createElement('p');
                explanation.className = 'explanation';
                explanation.innerHTML = item['解釋']; // 使用 innerHTML 讓可能存在的粗體字生效
                back.appendChild(explanation);

                // 組合元素
                inner.appendChild(front);
                inner.appendChild(back);
                card.appendChild(inner);
                cardContainer.appendChild(card);
            });
        }

        // 初始化
        createTagButtons();
        createFlashcards();
    </script>
</body>
</html>
