<!DOCTYPE html>
<html lang="zh-TW">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Text Reader - Highlighted</title>
	<base></base>
	
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/default.min.css">
	<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/python.min.js"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/javascript.min.js"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/xml.min.js"></script> 

	<style>
		/* CSS 樣式來實現佈局和浮動視窗 */
		html, body {
			height: 100%;
			margin: 0;
			padding: 0;
			display: flex;
			flex-direction: column;
		}

		#header {
			height: 40px; /* 固定一行的高度 */
			background-color: #f0f0f0;
			display: flex;
			align-items: center;
			justify-content: flex-end; /* 將選單按鈕放在最右側 */
			padding: 0 10px;
			box-sizing: border-box;
			flex-shrink: 0; /* 不壓縮 header */
		}

		#menuButton {
			padding: 5px 10px;
			cursor: pointer;
		}

		/* 新增一個容器來取代原本的 #content 空間 */
		#content-container {
			flex-grow: 1; /* 填滿 header 下方的剩餘空間 */
			width: 100%;
			box-sizing: border-box;
			padding: 10px;
			overflow: auto; /* 確保內容可以滾動 */
			background-color: #f6f8fa; /* 程式碼背景色，與 default.min.css 協調 */
		}

		/* 隱藏 textarea，讓 pre/code 顯示內容 */
		#content {
			display: none; 
		}

		/* 高亮內容的樣式 */
		#highlighted-content {
			font-size: 16px;
			margin: 0; /* 移除 pre 預設的外邊距 */
		}
		
		/* 確保程式碼區塊填滿容器 */
		#highlighted-content code {
			 display: block; /* 讓 code 佔滿 pre 的寬度 */
		}
		
		/* 修正 highlight.js 的預設 padding，確保與容器 padding 一致 */
		#content-container pre {
			padding: 0;
			margin: 0;
			border: none;
			background-color: transparent; /* 使用容器的背景色 */
		}

		#dialog {
			display: none; /* 預設隱藏 */
			position: fixed;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			background-color: rgba(0, 0, 0, 0.5); /* 半透明灰色遮罩 */
			z-index: 1000; /* 確保浮動覆蓋其他元素 */
			align-items: flex-start; /* 將內容對齊頂部 */
			justify-content: flex-end; /* 將按鈕對齊右側 */
		}
		
		#dialog.open {
			display: flex;
		}

		#hideDialog {
			position: absolute;
			top: 10px;
			right: 10px;
			padding: 10px;
			cursor: pointer;
			background-color: white;
			border: 1px solid #ccc;
		}
	</style>
	<script>
	async function readtext (url,options) {
		const response=await fetch(url,options);
		// 檢查響應是否成功
		if (!response.ok) {
			throw new Error(`HTTP error! status: ${response.status}`);
		}
		
		const reader=response.body.getReader();
		let s="";
		while (true) {
			const c=await reader.read();
			if (c.done) break; // 讀取完成時跳出循環
			s += new TextDecoder("utf-8").decode(c.value); // 確保 await 在 async 函式中
		}
		return s;
	}

	document.addEventListener('DOMContentLoaded', async () => {
		const contentArea = document.getElementById('content'); // 隱藏的 textarea
		const highlightedContent = document.getElementById('highlighted-code'); // code 元素
		const menuButton = document.getElementById('menuButton');
		const dialog = document.getElementById('dialog');
		const hideDialogButton = document.getElementById('hideDialog');

		try {
			const urlParams = new URLSearchParams(window.location.search);
			const baseUrl = urlParams.get('base');
			const targetUrl = urlParams.get('url'); 
			const syntaxParam = urlParams.get('syntax'); // 新增：讀取 syntax 參數

			// 1. 設置 Base URL
			if (baseUrl) {
				document.head.querySelector("base").setAttribute("href",baseUrl);
			}

			// 2. 處理 Syntax 參數
			let languageClass = '';
			if (syntaxParam) {
				switch (syntaxParam.toLowerCase()) {
					case 'py':
						languageClass = 'language-python';
						break;
					case 'js':
						languageClass = 'language-javascript';
						break;
					case 'html':
						languageClass = 'language-xml'; // highlight.js 用 'xml' 處理 HTML
						break;
					default:
						// 不支援的語法，不添加語言類別
						break;
				}
				if (languageClass) {
					highlightedContent.classList.add(languageClass);
				}
			}


			// 3. 讀取並顯示內容
			if (targetUrl) {
				// 顯示讀取中訊息在 code 元素中
				highlightedContent.textContent = '正在讀取文字...';
				
				const textContent = await readtext(targetUrl);
				
				// 將內容同時放入 textarea 和 code 區塊
				contentArea.value = textContent;
				highlightedContent.textContent = textContent;

				// 執行程式碼高亮
				if (languageClass) {
					hljs.highlightElement(highlightedContent);
				}
				
			} else {
				highlightedContent.textContent = '請在 URL search string 中指定目標檔案 (例如: ?url=somefile.txt)。';
			}
		} catch (error) {
			console.error('讀取文字失敗:', error);
			highlightedContent.textContent = `讀取文字失敗: ${error.message}`;
		}

		// 處理選單按鈕的點擊事件
		if (menuButton) {
			menuButton.addEventListener('click', () => {
				dialog.classList.add('open');
			});
		}
		
		// 處理關閉按鈕的點擊事件
		if (hideDialogButton) {
			hideDialogButton.addEventListener('click', () => {
				dialog.classList.remove('open');
			});
		}

		// 處理點擊遮罩關閉對話框
		if (dialog) {
			 dialog.addEventListener('click', (event) => {
				// 如果點擊的目標是 #dialog 本身，則關閉
				if (event.target === dialog) {
					dialog.classList.remove('open');
				}
			});
		}
	});
	</script>
</head>
<body>
	<div id="header">
		<button id="menuButton">選單</button>
	</div>
	
	<div id="content-container">
		<textarea id="content"></textarea> <pre id="highlighted-content"><code id="highlighted-code"></code></pre> </div>
	
	<div id="dialog">
		<div style="background-color: white; padding: 20px; margin: 50px; border-radius: 5px;">
			<h2>設定/選單內容</h2>
			<p>這裡是用來放置選單項目的空間。</p>
		</div>
		<button id="hideDialog">X 關閉</button>
	</div>
</body>
</html>
