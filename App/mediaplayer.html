<!DOCTYPE html>
<html lang="zh-Hant">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>動態播放器</title>
	<base></base>
	<style>
		body {
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
			display: flex;
			justify-content: center;
			align-items: center;
			min-height: 100vh;
			margin: 0;
			background-color: #000;
			color: #333;
			overflow: hidden;
		}

		.player-container {
			width: 100vw;
			height: 100vh;
			background-color: #000;
			position: relative;
			box-shadow: none;
			border-radius: 0;
			display: flex;
			flex-direction: column;
			justify-content: center;
			align-items: center;
		}

		#lyricContainer {
			left: 2%;
			top: 2%;
			position:absolute;
			border-radius:16px;
			padding:6px 12px;
			font-size:3vmin;
			background:rgba(255,255,255,0.5);
			overflow: hidden;
		}

		#slideContainer {
			width: 100%;
			height: 100%;
			position: relative;
			background-color: #000;
			overflow: hidden;
		}

		.slide-item {
			position: absolute;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			object-fit: contain;
			opacity: 0;
			transition: all 1s ease-in-out;
			transform: scale(1.1);
		}

		.slide-item.active {
			opacity: 1;
			transform: scale(1);
		}

		/* --- 轉場效果 --- */
		.slide-item.transition-slide-in {
			transform: translateX(100%);
		}
		.slide-item.transition-slide-in.active {
			transform: translateX(0);
		}
		.slide-item.transition-zoom-in {
			transform: scale(1.5);
			opacity: 0;
		}
		.slide-item.transition-zoom-in.active {
			transform: scale(1);
			opacity: 1;
		}
		.slide-item.transition-reveal {
			 clip-path: circle(0% at 0 0);
		}
		.slide-item.transition-reveal.active {
			clip-path: circle(150% at 0 0);
		}

		/* --- 控制面板樣式 --- */
		.controls {
			position: absolute;
			bottom: 0;
			width: 90%;
			max-width: 600px;
			padding: 20px;
			background-color: rgba(255, 255, 255, 0.95);
			border-top-left-radius: 12px;
			border-top-right-radius: 12px;
			box-shadow: 0 -5px 20px rgba(0, 0, 0, 0.2);
			display: flex;
			flex-direction: column;
			gap: 15px;
			transition: transform 0.3s ease-in-out, opacity 0.3s ease-in-out;
			z-index: 10;
			left: 50%;
			transform: translateX(-50%);
		}

		.controls.hidden {
			transform: translateX(-50%) translateY(100%);
			opacity: 0;
		}

		#currentTrackInfo {
			text-align: center;
			font-size: 1.2em;
			font-weight: 500;
			padding: 10px;
			background-color: #fafafa;
			border-radius: 8px;
			border: 1px solid #eee;
			white-space: nowrap;
			overflow: hidden;
			text-overflow: ellipsis;
		}

		audio {
			width: 100%;
		}
		
		.button-group {
			display: flex;
			justify-content: center;
			gap: 10px;
		}

		button {
			padding: 10px 15px;
			border: none;
			border-radius: 8px;
			background-color: #007bff;
			color: white;
			font-size: 16px;
			cursor: pointer;
			transition: background-color 0.3s, transform 0.1s;
			flex-grow: 1; /* 讓按鈕平均分配空間 */
			min-width: 0; /* 修正 flex 佈局下的最小寬度問題 */
		}

		button:hover {
			background-color: #0056b3;
		}

		button:active {
			transform: scale(0.95);
		}
		
		button.active {
			background-color: #28a745;
			box-shadow: 0 0 10px rgba(40, 167, 69, 0.5);
		}
		
		/* 針對單曲循環按鈕使用不同的顏色來區分 */
		button#loopBtn.active {
			background-color: #ffc107; /* 警告色 */
			color: #333;
			box-shadow: 0 0 10px rgba(255, 193, 7, 0.5);
		}

	</style>
</head>
<body>

	<div class="player-container" id="playerContainer">
		<div id="slideContainer">
		</div>
		<pre id="lyricContainer"></pre>
		<div class="controls hidden" id="controlsPanel">
			<div id="currentTrackInfo">正在載入播放清單...</div>
			<audio id="audioPlayer" controls></audio>
			<div class="button-group">
				<button id="prevBtn" func="playPrevTrack">上一首</button>
				<button id="nextBtn" func="playNextTrack">下一首</button>
			</div>
			<div class="button-group">
				<button id="seqBtn" func="setMode" args="normal" class="active">循序</button>
				<button id="randBtn" func="setMode" args="random">隨機</button>
				<button id="loopBtn" func="setMode" args="loop">單曲循環</button>
			</div>
		</div>
	</div>

	<script>
		document.addEventListener('DOMContentLoaded', () => {
			
			const TRANSITION_EFFECTS = [
				'transition-slide-in',
				'transition-zoom-in',
				'transition-reveal',
				'' ];
			const TICK_RATE = 250;
			const CONTROL_PANEL_LIFE = 20;

			class LyricPlayer {
				constructor (scr) {
					this.screen = scr;
					this.list = [];
					this.current = undefined;
				}
				play (list) {
					this.list=list;
				}
				tick (ts) {
					function match (v,ts) { return v&&(ts-v.TS[0])*(v.TS[1]-ts)>0 }
					if (match(this.current,ts)) return;
					this.current=this.list.find((v) => match(v,ts));
					this.screen.innerHTML=this.current ? this.current.V.join("\n") : "";
				}
			}

			class SlidePlayer {
				constructor (scr) {
					// {{{
					this.screen = scr;
					this.list = [];
					this.current = undefined;
					// }}}
				}
				__parser__ (val, cur, prev) {
					// 載入播放清單設定 {{{
					if (Array.isArray(val)) {
						cur.src = val[0];
						if (val[2])
							cur.EndTS=val[2];
						if (val[1]) {
							cur.BeginTS=val[1];
							if(prev && !prev.EndTS)
								prev.EndTS=cur.BeginTS;
						}
					} else cur.src = val; 
					// }}}
				}
				__schedule__ (dur) {
					// 計算個元件的 起始與結束時間 {{{
					this.list[0].BeginTS=0;
					this.list[this.list.length-1].EndTS=dur;
					for (let i=0; i<this.list.length; i++) {
						if (undefined!==this.list[i].EndTS) continue;
						for (let j=i+1; j<this.list.length; j++)
							if (this.list[j].EndTS) {
								for (let k=i; k<j; k++)
									this.list[k+1].BeginTS =
									this.list[k].EndTS =
										this.list[k].BeginTS
										+ (this.list[j].EndTS-this.list[k].BeginTS)/(j-k+1);
								break;
							}
					}
					//for (let debug of this.list)
					//	console.log(debug.src,debug.BeginTS,debug.EndTS);
					this.current=false;
					// }}}
				}
				__seek__ (ts) {
					// 尋找目前時間戳記所在的影像 {{{
					for (let nc of this.list)
						if ((ts-nc.BeginTS)*(nc.EndTS-ts)>0) 
							return nc;
					return false;
					// }}}
				}
				play (list) {
					// 初始化播放清單，並開始播放 {{{
					if (!list || list.length === 0)
						return;
					this.screen.innerHTML = '';
					this.list = [];
					this.current = undefined;
					let prev,cur;
					for (let src of list) {
						let cur = document.createElement('img');
						cur.className = 'slide-item';
						this.__parser__(src, cur, prev);
						this.list.push(cur);
						this.screen.appendChild(cur);
						prev = cur;
					}
					// }}}
				}
				tick (ts, dur) {
					// 顯示下一個畫面 {{{
					if (undefined===this.current && dur)
						this.__schedule__(dur);

					if ( // 若尚未排程完成，或影像對象未改變，則不做任何變動
						undefined===this.current ||
						(ts-this.current.BeginTS)*(this.current.EndTS-ts)>0
					)	return;

					((oi) => { // 移除舊目標的轉場效果
						if (!oi) return;
						oi.classList.remove('active');
						TRANSITION_EFFECTS.forEach(t => {
							if (t) oi.classList.remove(t);
						});
					})(this.screen.querySelector('.slide-item.active'));

					const randomTransition = TRANSITION_EFFECTS[
						Math.floor(Math.random() * TRANSITION_EFFECTS.length)
					];
					((ni) => { // 套用轉場效果至新目標
						if (!ni) return;
						if (randomTransition)
							ni.classList.add(randomTransition);
						setTimeout(() => ni.classList.add('active'), 50);
					})(this.current=this.__seek__(ts));
					// }}}
				}
			};

			class SlidePlayerFX extends SlidePlayer {
				__schedule__ (dur) {
					// {{{
					for (let l=1;(this.period=dur/(this.list.length*l)) > 10;l++);
					this.current=false;
					// }}}
				}
				__seek__ (ts) {
					// {{{
					let idx = Math.floor(ts/this.period),
						cur = this.list[idx%this.list.length];
					cur.BeginTS=idx*this.period;
					cur.EndTS=idx*this.period+this.period;
					return cur;
					// }}}
				}
			};

			const Player = new (class {
				constructor (panel) {
					// {{{
					this.panel = panel;
					this.info = document.getElementById('currentTrackInfo');
					this.player = panel.querySelector("audio");
					this.player.mode = "normal"; // normal|random|loop
					this.player.list = [];
					this.current = 0;
					this.life=0;

					// 處理面板的點擊事件
					this.panel.addEventListener('click', (e) => {
						e.stopPropagation();
						this.tick(CONTROL_PANEL_LIFE); // 延長面板顯示的時間

						let func=e.target.getAttribute("func");
						if (this[func]) // TODO check callable
							this[func].apply(this,[e.target].concat(
								(e.target.getAttribute("args")||"").split(",")
							));
					});
					// 處理歌曲結束 (新增循環模式判斷)
					this.player.addEventListener('ended', () => { // 處理單曲播放結束
						if ("loop"===this.player.Mode) {
							// 如果是單曲循環模式，重設播放時間並重新播放當前歌曲
							this.player.currentTime = 0;
							this.player.play();
						} else {
							// 否則，播放下一首歌曲
							this.playNextTrack();
						}
					}); 
					this.panel.classList.add('hidden');
					// }}}
				}
				play (list) {
					// 播放列表 {{{
					// ? this.player.stop();
					if (list) {
						Promise.all(list.map(
							(u) => (async (track) => {
								if ("string"===typeof(track)){
									let url=PATH.join(this.url,track);
									track=await loadObj(url);
									track.BaseURL=PATH.dir(url)+"/";
								}
								return track
							})(u)
						)).then((lst) => {
							lst.forEach((i,k)=>{
								i.__key__=k;
							});
							this.player.list=lst;
							console.log("播放清單已載入:", lst);
							if (this.player.list.length > 0)
								this.loadTrack(0);
							else
								this.info.textContent = '播放清單為空';
						});
					} else
						this.info.textContent = '無法載入播放清單';
					// }}}
				}
				tick (life) {
					// 心跳計時器 {{{
					if(this.player.paused)
						life = CONTROL_PANEL_LIFE;
					if (life) {
						this.life=life;
						if (this.life!=0) this.panel.classList.remove('hidden');
					} else {
						if (this.Slides)
							this.Slides.tick(this.player.currentTime,this.player.duration);
						if (this.Lyrics)
							this.Lyrics.tick(this.player.currentTime);
						if (this.life>0) { // 面板自動隱藏
							this.life--;
							if (this.life==0) this.panel.classList.add('hidden');
						}
					}
					// }}}
				}
				setMode (btn, mode) {
					// 播放模式設定 {{{
					[... btn.parentNode.querySelectorAll('.active')]
						.forEach((e) => e.classList.remove('active'));
					btn.classList.add('active');
					switch (mode) {
					case "normal":	// 循序模式切換
						this.player.list=this.player.list.sort((a,b)=>a.__key__-b.__key__);
						console.log(this.player.list);
						this.player.Mode="normal";
						this.loadTrack(0);
						break;
					case "random":	// 隨機模式切換
						// shuffle the playlist by generating shuffle index key for every items
						this.player.list.forEach((i)=>{
							i.__skey__=Math.random();
						});
						this.player.list=this.player.list.sort((a,b)=>a.__skey__-b.__skey__);
						console.log(this.player.list);
						this.player.Mode="random";
						this.loadTrack(0);
						break;
					case "loop":	// 循還模式切換
						this.player.Mode="loop";
						break;
					}
					// }}}
				}
				loadTrack (trackIndex) {
					// {{{
					if (trackIndex < 0 || trackIndex >= this.player.list.length) {
						console.error('無效的歌曲索引:', trackIndex);
						return;
					}
					this.current = trackIndex;

					(async () => {
						let track = this.player.list[this.current];
						document.head.querySelector("base").setAttribute("href",track.BaseURL);
						this.player.src = track.Music;
						this.info.textContent = "正在播放: "+(track.Title||track.Music);
						if(this.Slides) this.Slides.play(track.Photo);
						if(this.Lyrics) this.Lyrics.play(track.Lyric);
					})();
					// }}}
				}
				playNextTrack () {
					// 播放下一首歌曲 (根據播放模式) {{{
					let nextIndex;
					if ("random"===this.player.mode) {
						if (this.player.list.length <= 1) {
							nextIndex = 0;
						} else {
							do {
								nextIndex = Math.floor(Math.random() * this.player.list.length);
							} while (nextIndex === this.current);
						}
					} else {
						nextIndex = (this.current + 1) % this.player.list.length;
					}
					this.loadTrack(nextIndex);
					this.player.play(); 
					// }}}
				}
				playPrevTrack () {
					// 播放前一首歌曲 (根據播放模式) {{{
					if ("random"===this.player.mode) {
						playNextTrack();
						return;
					}
					let prevIndex = (this.current - 1 + this.player.list.length) % this.player.list.length;
					this.loadTrack(prevIndex);
					this.player.play();
					// }}}
				}
			})(document.getElementById('controlsPanel'));

			// tick for playback heartbeat check
			setInterval(()=>Player.tick(), TICK_RATE);

			// 串接影像輪播器
			Player.Slides = new SlidePlayerFX(document.getElementById('slideContainer'));
			Player.Lyrics = new LyricPlayer(document.getElementById('lyricContainer'));

			// 顯示控制面板
			document.getElementById('playerContainer')
				.addEventListener('click', () => Player.tick(CONTROL_PANEL_LIFE));

			let PATH={
				dir: (p) => p.replace(/\/[^\/]+(\?.*)?$/,''),
				filename: (p) => /\/([^\/]+)(\?.*)?$/.exec(p)[1],
				join: (pb,p) => PATH.dir(pb).split('/').concat(p.split('/')).reduce((r,c) => {
					".." === c ? r.pop() : "." !== c ? r.push(c) : r;
					return r;
				},[]).join("/")
			};

			async function loadObj (url) {
				if (url.endsWith('.js')) {
					return await (new Promise((or,oe) => {
						const script = document.createElement('script');
						script.src = url;
						script.onload = () => {
							if (script.value && "object"===typeof(script.value)) {
								let result=script.value;
								script.parentNode.removeChild(script);
								or(result);
							} else 
								oe("Failed");
						};
						script.onerror = oe;
						document.head.appendChild(script);
					}));
				} else 
				if (url.endsWith('.json')) {
					alert("TODO");
				} else
					console.log("Unknown playlist url: "+url_playlist);
			}

			(async function (url_playlist) {
				url_playlist=PATH.join(location.href,url_playlist);
				Player.url=url_playlist;
				Player.play(await loadObj(url_playlist));
			})(new URLSearchParams(window.location.search).get('playlist') || 'index.js');
		});
	</script>

</body>
</html>
