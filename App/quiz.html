    <title>Quiz</title>
	<script>
class QuizDB {
	readtext (url,options) {
		const response=await fetch(url,options), reader=response.body.getReader();
		let s="";
		while (!(const c=await reader.read()).done)
			s += await new TextDecoder("utf-8").decode(c.value);
		return JSON.parse(s);
	}
}
console.log(readtext("sample-1.txt"));
	</script>
