<!DOCTYPE html>
<html lang="zh-TW">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Markdown Editor & Manager</title>
	<script src='http://g3c.cyberpiers.com:4780/App/TeX.js'></script>
	<style>
		:root {
			--bar-height: 60px;
			--primary: #2563eb;
			--bg: #ffffff;
			--bar-bg: #f8fafc;
			--border: #e2e8f0;
		}

		html, body {
			margin: 0; padding: 0; height: 100%; overflow: hidden;
			font-family: -apple-system, system-ui, sans-serif;
		}

		/* 頂部工具列 */
		.top-bar {
			height: var(--bar-height);
			background: var(--bar-bg);
			border-bottom: 1px solid var(--border);
			display: flex;
			align-items: center;
			justify-content: space-between;
			padding: 0 20px;
			box-sizing: border-box;
		}

		.btn-group { display: flex; gap: 10px; align-items: center; }

		button {
			padding: 8px 15px;
			border-radius: 6px;
			border: 1px solid var(--border);
			background: white;
			cursor: pointer;
			font-size: 14px;
			font-weight: 500;
		}

		button:hover { background: #f1f5f9; }
		.btn-primary { background: var(--primary); color: white; border: none; }
		.btn-primary:hover { background: #1d4ed8; }
		.btn-danger { color: #dc2626; }
		.btn-danger.active { background: #dc2626; color: white; }

		/* 檔案列表樣式 */
		#view-list {
			height: 100%; overflow-y: auto; padding: 20px; box-sizing: border-box;
		}
		.file-list { list-style: none; padding: 0; max-width: 800px; margin: 0 auto; }
		.file-item {
			display: flex; justify-content: space-between; align-items: center;
			padding: 15px; border-bottom: 1px solid var(--border);
		}
		.file-name { flex-grow: 1; cursor: pointer; font-weight: 600; }
		.delete-mode .file-name { color: #dc2626; }
		.rename-link { font-size: 13px; color: var(--primary); cursor: pointer; text-decoration: underline; }

		/* 編輯與檢視區 (滿版) */
		#view-editor { height: 100%; display: flex; flex-direction: column; }
		.main-content {
			flex-grow: 1;
			width: 100%;
			height: calc(100vh - var(--bar-height));
			position: relative;
		}

		textarea, #preview-area {
			width: 100%;
			height: 100%;
			border: none;
			outline: none;
			padding: 30px;
			box-sizing: border-box;
			font-size: 16px;
			line-height: 1.6;
			position: absolute;
			top: 0; left: 0;
			overflow-y: auto;
		}

		textarea { font-family: 'Consolas', monospace; resize: none; background: #fff; }
		#preview-area { background: #fff; display: none; }

		/* Markdown 內容稍微美化 */
		#preview-area h1 { border-bottom: 1px solid var(--border); padding-bottom: 10px; }
		#preview-area code { background: #f1f5f9; padding: 2px 4px; border-radius: 4px; }

		.status-text { font-size: 12px; color: #94a3b8; }
	</style>
</head>
<body>
	<div id="view-list">
		<div class="top-bar">
			<div class="btn-group">
				<button class="btn-primary" onclick="createNewFile()">+ 新增</button>
				<button class="btn-action" onclick="document.getElementById('file-upload').click()">↑ 上傳</button>
			</div>
			<div style="text-align: right;"></div>
		</div>
		<input type="file" id="file-upload" accept=".md,.txt" style="display: none;" onchange="handleFileUpload(event)">
		<ul id="file-list-ul" class="file-list"></ul>
	</div>

	<div id="view-editor" style="display: none;">
		<div class="top-bar">
			<div class="btn-group">
				<button onclick="goBack()">←</button>
	   			<button id="toggle-view-btn" onclick="toggleViewMode()">🔍</button>
				<button onclick="handleCopy()">📋</button>
				<button onclick="handleDownload()">📥</button>
				<button class="btn-danger" onclick="deleteCurrentFile()" style="margin-left: 10px;">🗑️ 刪除檔案</button>
			</div>
			<div style="text-align: right;">
				<div id="current-filename" style="font-weight: bold;"></div>
				<div id="save-status" class="status-text"></div>
			</div>
		</div>
		<div class="main-content">
			<textarea id="md-input" placeholder="在這裡開始寫作..."></textarea>
			<div id="preview-area"></div>
		</div>
	</div>

<script>
	const urlParams = new URLSearchParams(window.location.search);
	const remoteUrl = urlParams.get('url');
	const currentFile = urlParams.get('file');
	const viewonly = urlParams.get('viewonly')!==null;
	let isDeleteMode = false;
	let isPreviewMode = false;
	let autoSaveTimer;

	// 初始化判斷
	window.onload = async () => {
		if (remoteUrl) {
			await initRemoteUrl(remoteUrl);
		} else if (currentFile) {
			initLocalStorage(decodeURIComponent(currentFile));
		} else {
			renderFileList();
		}
	};

	// --- 列表邏輯 ---
	function renderFileList() {
		const listUl = document.getElementById('file-list-ul');
		listUl.innerHTML = '';
		const keys = Object.keys(localStorage).sort().reverse();

		keys.forEach(key => {
			const li = document.createElement('li');
			li.className = 'file-item';
			li.innerHTML = `
				<div class="file-name" onclick="onFileClick('${encodeURIComponent(key)}')">${key}</div>
				<div class="rename-link" onclick="renameFile(event, '${encodeURIComponent(key)}')">改名</div>
			`;
			listUl.appendChild(li);
		});

		if(keys.length === 0) {
			listUl.innerHTML = '<p style="text-align:center; color:#94a3b8; margin-top:50px;">目前沒有存檔。</p>';
		}
	}

	function initLocalStorage(fileName) {
		document.getElementById('current-filename').textContent = fileName;
		
		initEditor(localStorage.getItem(fileName)||"");

		const textarea=document.getElementById('md-input');
		textarea.addEventListener('input', () => {
			document.getElementById('save-status').textContent = "儲存中...";
			clearTimeout(autoSaveTimer);
			autoSaveTimer = setTimeout(() => {
				localStorage.setItem(fileName, textarea.value);
				document.getElementById('save-status').textContent = "已自動儲存";
			}, 500);
		});
	}

	async function initRemoteUrl(url) {
		try {
			const response = await fetch(url);
			if (!response.ok) throw new Error("網路請求失敗");
			const content = await response.text();

			if (viewonly)
				return initEditor(content||"");

			// 取得基礎檔名
			let baseName = url.split('/').pop() || "remote_file.md";
			let finalName = baseName;
			let counter = 1;

			// 碰撞檢查：如果已存在，則更名 (例如 test.md -> test(1).md)
			while (localStorage.getItem(finalName) !== null) {
				const nameParts = baseName.split('.');
				const ext = nameParts.pop();
				finalName = `${nameParts.join('.')}(${counter}).${ext}`;
				counter++;
			}

			// 寫入 localStorage 並轉址到編輯模式
			localStorage.setItem(finalName, content);
			window.location.search = `?file=${encodeURIComponent(finalName)}`;
		} catch (err) {
			alert("無法讀取遠端檔案: " + err.message);
			window.location.search = '';
		}
	}

	function onFileClick(encodedName) {
		window.location.search = `?file=${encodedName}`;
	}

	function createNewFile() {
		const name = ((d)=>
			String(d.getYear()%100).padStart(2,'0') +
			String(d.getMonth()+1).padStart(2,'0') +
			String(d.getDate()).padStart(2,'0') + '-' +
			String(d.getHours()).padStart(2,'0') +
			String(d.getMinutes()).padStart(2,'0')
		)(new Date());
		localStorage.setItem(name, "");
		window.location.search = `?file=${encodeURIComponent(name)}`;
	}

	function renameFile(e, encodedOld) {
		e.stopPropagation();
		const oldName = decodeURIComponent(encodedOld);
		const newName = prompt("新名稱：", oldName);
		if (newName && newName !== oldName) {
			localStorage.setItem(newName, localStorage.getItem(oldName));
			localStorage.removeItem(oldName);
			renderFileList();
		}
	}

	// --- 編輯器邏輯 ---
	function initEditor(content="") {
		document.getElementById('view-list').style.display = 'none';
		document.getElementById('view-editor').style.display = 'flex';
		const textarea = document.getElementById('md-input');
		textarea.value = content;
		toggleViewMode(viewonly);
	}

	function goBack() { window.location.search = ''; }

	// --- 模式切換邏輯 (重點) ---
	function toggleViewMode(target) {
		const textarea = document.getElementById('md-input');
		const preview = document.getElementById('preview-area');
		const btn = document.getElementById('toggle-view-btn');

		if (target===undefined)
			target=(!isPreviewMode);
		isPreviewMode = target;

		if (isPreviewMode) {
			document.getElementById("TeX").syncMD(preview,textarea.value);
			preview.style.display = 'block';
			textarea.style.display = 'none';
			btn.textContent = "✎";
		} else {
			preview.style.display = 'none';
			textarea.style.display = 'block';
			btn.textContent = "🔍";
		}
	}

	// 根據模式處理複製
	function handleCopy_HTTPS() {
		const content = isPreviewMode 
			? document.getElementById('preview-area').innerHTML 
			: document.getElementById('md-input').value;
		
		navigator.clipboard.writeText(content).then(() => {
			alert(`${isPreviewMode ? 'HTML' : 'Markdown'} 內容已複製！`);
		});
	}

	function handleCopy() { // 根據模式處理複製 (使用舊式 execCommand 做法)
		const content = isPreviewMode 
			? document.getElementById('preview-area').innerHTML 
			: document.getElementById('md-input').value;
	
		// 1. 建立一個隱藏的 textarea 元件
		const textArea = document.createElement("textarea");
		textArea.value = content;
	
		// 2. 確保元件在視覺上不可見，但仍存在於 DOM 中以便選取
		textArea.style.position = "fixed";
		textArea.style.left = "-9999px";
		textArea.style.top = "0";
		document.body.appendChild(textArea);
	
		// 3. 選取文字內容
		textArea.focus();
		textArea.select();
		textArea.setSelectionRange(0, 99999); // 針對行動裝置的相容性處理

		try {
			// 4. 執行複製指令
			const successful = document.execCommand('copy');
			if (successful) {
				alert(`${isPreviewMode ? 'HTML' : 'Markdown'} 內容已複製！`);
			} else {
				alert('複製失敗，請手動選取內容。');
			}
		} catch (err) {
			alert('瀏覽器不支援此複製方式');
		}

		// 5. 移除臨時元件
		document.body.removeChild(textArea);
	}

	// 根據模式處理下載
	function handleDownload() {
		const content = isPreviewMode 
			? document.getElementById('preview-area').innerHTML 
			: document.getElementById('md-input').value;
		
		const extension = isPreviewMode ? '.html' : '.md';
		const type = isPreviewMode ? 'text/html' : 'text/markdown';
		const fileName = currentFile.replace(/\.[^/.]+$/, "") + extension;

		const blob = new Blob([content], { type: type });
		const url = URL.createObjectURL(blob);
		const a = document.createElement('a');
		a.href = url;
		a.download = fileName;
		a.click();
		URL.revokeObjectURL(url);
	}

	// --- 功能：處理檔案上傳 ---
	function handleFileUpload(event) {
		const file = event.target.files[0];
	   	if (!file) return;

		// 取得檔名 (包含副檔名)
		const fileName = file.name;
	
		// 檢查是否已有同名檔案
		if (localStorage.getItem(fileName) !== null) {
			if (!confirm(`檔案「${fileName}」已存在，是否要覆蓋？`)) {
				event.target.value = ''; // 清空選擇器
				return;
			}
		}

		const reader = new FileReader();
		reader.onload = function(e) {
			const content = e.target.result;
			// 存入 localStorage
			localStorage.setItem(fileName, content);
			// 重新渲染列表
			renderFileList();
			alert(`檔案「${fileName}」上傳成功！`);
			// 清空選擇器，以便下次可以上傳同一個檔案
			event.target.value = '';
		};

		// 以 UTF-8 編碼讀取文字內容
		reader.readAsText(file, "UTF-8");
	}

	function deleteCurrentFile() {
		if (confirm(`確定要永久刪除「${currentFile}」嗎？此操作無法還原。`)) {
   			localStorage.removeItem(currentFile);
			goBack(); // 刪除後返回列表頁
		}
	}
</script>
</body>
</html>
