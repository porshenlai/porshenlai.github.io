<!DOCTYPE html>
<html>
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
	<meta http-equiv="X-UA-Compatible" content="IE=edge,Chrome=1"/>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.1.5/jszip.min.js"></script>
	<script src="epub.min.js"></script>
</head>
<body>
<div style="position:fixed;left:0;top:0;right:0;bottom:0;display:flex;flex-flow:column nowrap;justify-content:space-between;">
	<div id="area" style="flex:1 1 auto;width:100%;height:100%;border:1px solid black;"></div>
	<div style="display:flex;flex-flow:row nowrap;justify-content:space-between;">
		<button onclick="App.next()">◀</button>
		<button UID="Progress" onclick="App.toc()">Loading ...</button>
		<button onclick="App.next()">▶</button>
	</div>
</div>
<script>
	try {
		let book, rendition, MsgBar=document.body.querySelector('[UID="Progress"]');
		book = ePub(location.search.substr(1));
		book.on("openFailed",(e)=>{
			(MsgBar||{}).textContent="開啟失敗: "+location.search.substr(1);
			console.log("ERROR: ",e);
		});

		rendition = book.renderTo("area", {width: '100%', height: '100%'});
		rendition.on("relocated", (location) => {
			const ref=location.start;
			if (ref&&MsgBar)
				MsgBar.textContent=`[${ref.index}], ${ref.displayed.page} / ${ref.displayed.total}`;
		});

		book.ready.then(() => {
			if (book.navigation && book.navigation.toc.length > 0)
				book.TOC_CFI=book.navigation.toc.reduce((rst,toc)=>{
					console.log(toc);
					return rst||toc.cfi;
				},undefined);
			console.log("========>",book.TOC_CFI);
			window.App={
				toc:()=>{
					console.log(">>>>>>",book.TOC_CFI);
					rendition.display(book.TOC_CFI);
				},
				prev:()=>rendition.prev(),
				next:()=>rendition.next()
			}
			rendition.display().then(console.log,console.log);
    	});
	} catch (e) {
		console.log("Exception: ",e);
	}
</script>
</body>
</html>
