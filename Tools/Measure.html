<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebRTC 影像測距工具</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            background-color: #f4f4f4;
        }
        h1, h3 {
            color: #333;
        }
        #video-container {
            position: relative;
            margin-bottom: 10px;
        }
        video {
            background-color: #000;
            border: 2px solid #555;
            border-radius: 8px;
        }
        canvas {
            display: none; /* 擷取後才顯示 */
            border: 2px solid #007bff;
            border-radius: 8px;
            cursor: crosshair;
        }
        #snapButton {
            font-size: 16px;
            padding: 10px 20px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-bottom: 10px;
        }
        #snapButton:hover {
            background-color: #218838;
        }
        #controls {
            display: none; /* 擷取後才顯示 */
            padding: 15px;
            background-color: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            width: 640px;
        }
        #controls div {
            margin-bottom: 10px;
        }
        #instructions {
            font-size: 1.1em;
            color: #d9534f;
            font-weight: bold;
            min-height: 20px;
            text-align: center;
            margin-bottom: 15px;
        }
        #result {
            font-size: 1.2em;
            font-weight: bold;
            color: #0275d8;
        }
        input[type="number"] {
            padding: 5px;
            font-size: 14px;
            width: 100px;
        }
        #setRefButton {
            font-size: 14px;
            padding: 5px 10px;
            background-color: #0275d8;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-left: 10px;
        }
        #setRefButton:hover {
            background-color: #025aa5;
        }
        #setRefButton:disabled {
            background-color: #aaa;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <h1>WebRTC 影像測距工具 (3點校準版)</h1>

    <div id="instructions">正在啟動攝像頭...</div>

    <div id="video-container">
        <video id="video" width="640" height="480" autoplay playsinline></video>
        <canvas id="canvas" width="640" height="480"></canvas>
    </div>

    <button id="snapButton">擷取畫面</button>

    <div id="controls">
        <h3>第一階段：設定參考線</h3>
        <div>
            <label for="refDist1">P1 到 P1.5 的實際距離：</label>
            <input type="number" id="refDist1" placeholder="例如：50">
        </div>
        <div>
            <label for="refDist2">P1.5 到 P2 的實際距離：</label>
            <input type="number" id="refDist2" placeholder="例如：50">
        </div>
        <button id="setRefButton" disabled>鎖定參考線 (進入第二階段)</button>
        <hr>
        <h3>第二階段：實際丈量</h3>
        <div id="result">丈量結果：-</div>
    </div>

	<script>
        // --- 輔助 Class：Vector2D ---
        /**
         * 用於 2D 向量和點的計算。
         * 雖然 JavaScript 物件 {x, y} 很好用，但 class 能讓意圖更清晰。
         */
        class Vector2D {
            constructor(x, y) {
                this.x = x;
                this.y = y;
            }

            /** 從點 A 到點 B 建立一個向量 */
            static fromPoints(pA, pB) {
                return new Vector2D(pB.x - pA.x, pB.y - pA.y);
            }

            /** 向量加法 */
            add(v) {
                return new Vector2D(this.x + v.x, this.y + v.y);
            }

            /** 向量乘以一個純量 */
            multiply(scalar) {
                return new Vector2D(this.x * scalar, this.y * scalar);
            }

            /** 內積 (Dot Product) */
            dot(v) {
                return this.x * v.x + this.y * v.y;
            }

            /** 向量的長度平方 (Magnitude Squared) */
            magSq() {
                return this.x * this.x + this.y * this.y;
            }

            /** 將此向量轉換為點物件 {x, y} */
            toPoint() {
                return { x: this.x, y: this.y };
            }
        }

        // --- 核心邏輯 Class：PerspectiveLineMeasure ---
        /**
         * 封裝 3 點校準、投影和測量邏輯
         */
        class PerspectiveLineMeasure {
            constructor() {
                // 參考點
                this.p1 = null;
                this.p2 = null;
                
                // 參考線的向量和長度
                this.v_p1_p2 = null;
                this.magSq_p1_p2 = 0;
                
                // 校準模型 f(t) = a*t^2 + b*t 的參數
                this.a = 0;
                this.b = 0;
                
                this.isCalibrated = false;
            }

            /**
             * 設定 P1-P2 參考線
             * @param {object} p1 - {x, y}
             * @param {object} p2 - {x, y}
             * @returns {boolean} 是否成功設定
             */
            setBaseLine(p1, p2) {
                this.p1 = p1;
                this.p2 = p2;
                this.v_p1_p2 = Vector2D.fromPoints(p1, p2);
                this.magSq_p1_p2 = this.v_p1_p2.magSq();
                
                this.isCalibrated = false; // 重設校準

                if (this.magSq_p1_p2 === 0) {
                    console.error("P1 和 P2 不能在同一個點。");
                    return false;
                }
                return true;
            }

            /**
             * 將一個點 P 投影到 P1-P2 線上
             * @param {object} p - 要投影的點 {x, y}
             * @returns {object} { point: 投影點 {x, y}, t: 參數值 }
             * 參數 t: 0=P1, 1=P2.
             */
            projectPoint(p) {
                if (!this.p1 || !this.v_p1_p2) {
                    throw new Error("尚未設定 P1-P2 參考線。");
                }
                if (this.magSq_p1_p2 === 0) {
                     return { point: { x: this.p1.x, y: this.p1.y }, t: 0 };
                }

                const v_p1_p = Vector2D.fromPoints(this.p1, p);
                const dot = v_p1_p.dot(this.v_p1_p2);
                const t = dot / this.magSq_p1_p2;

                // 計算投影點: p1_vec + v_p1_p2 * t
                const p1_vec = new Vector2D(this.p1.x, this.p1.y);
                const proj_vec = p1_vec.add(this.v_p1_p2.multiply(t));
                
                return { point: proj_vec.toPoint(), t: t };
            }

            /**
             * 使用 P1.5 和真實距離來校準模型
             * @param {object} p1_5 - 點 {x, y}
             * @param {number} realDist1 - (P1 -> P1.5) 的真實距離
             * @param {number} realDist2 - (P1.5 -> P2) 的真實距離
             * @returns {object} { success: boolean, message: string }
             */
            calibrate(p1_5, realDist1, realDist2) {
                // 獲取 P1.5 在線上的參數 t
                const { t: t_1_5 } = this.projectPoint(p1_5);

                if (t_1_5 <= 0 || t_1_5 >= 1) {
                    return { 
                        success: false, 
                        message: "錯誤：P1.5 必須在 P1 和 P2 之間。請重新點選。" 
                    };
                }

                // 解 f(t) = a*t^2 + b*t
                const totalRealDist = realDist1 + realDist2;
                
                // 避免除以零 (雖然 t_1_5 已經被 0 和 1 擋掉，但 (t^2 - t) 在 0 和 1 之間恆為負)
                const denominator = (t_1_5 * t_1_5 - t_1_5);
                if (Math.abs(denominator) < 1e-9) {
                     return { 
                        success: false, 
                        message: "校準時發生數學錯誤 (分母為零)。" 
                    };
                }

                this.a = (realDist1 - totalRealDist * t_1_5) / denominator;
                this.b = totalRealDist - this.a;
                this.isCalibrated = true;
                
                console.log('校準模型已建立: a=', this.a, 'b=', this.b);
                return { success: true, message: "校準成功" };
            }

            /**
             * 將線上的參數 t 轉換為真實距離 (相對於 P1)
             * @param {number} t - 參數 t
             * @returns {number} 真實距離
             */
            mapTtoReal(t) {
                if (!this.isCalibrated) {
                    throw new Error("模型尚未校準。");
                }
                // f(t) = a*t^2 + b*t
                return this.a * t * t + this.b * t;
            }

            /**
             * 計算 P3 和 P4 之間的真實距離
             * @param {object} p3 - 點 {x, y}
             * @param {object} p4 - 點 {x, y}
             * @returns {number} 真實距離
             */
            calculateRealDistance(p3, p4) {
                if (!this.isCalibrated) {
                    console.warn("模型尚未校準，無法計算。");
                    return 0;
                }

                // P3 和 P4 必須先投影到線上
                const { t: t_p3 } = this.projectPoint(p3);
                const { t: t_p4 } = this.projectPoint(p4);

                // 轉換為真實座標
                const real_p3 = this.mapTtoReal(t_p3);
                const real_p4 = this.mapTtoReal(t_p4);

                return Math.abs(real_p4 - real_p3);
            }
        }
        
        // --- 主程式邏輯 ---
    
        // DOM 元素
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const snapButton = document.getElementById('snapButton');
        const controls = document.getElementById('controls');
        const instructions = document.getElementById('instructions');
        const refDistInput1 = document.getElementById('refDist1');
        const refDistInput2 = document.getElementById('refDist2');
        const setRefButton = document.getElementById('setRefButton');
        const resultDisplay = document.getElementById('result');

        // 狀態變數
        let state = 'INIT'; // INIT -> CAPTURING -> STAGE1_P1 -> STAGE1_P2 -> STAGE1_P1_5 -> STAGE1_READY -> STAGE2_P3 -> STAGE2_P4
        
        // 點位儲存 (只用於繪圖和傳遞給 class)
        let points = { p1: null, p1_5: null, p2: null, p3: null, p4: null };
        let snapshot = null;
        
        // 核心邏輯實例
        let lineMeasure = new PerspectiveLineMeasure();

        // --- 1. 啟動攝像頭 ---
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'environment' } 
                });
                video.srcObject = stream;
                video.onloadedmetadata = () => {
                    video.width = video.videoWidth;
                    video.height = video.videoHeight;
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    controls.style.width = `${video.width}px`;
                    state = 'CAPTURING';
                    updateInstructions();
                };
            } catch (err) {
                console.error("無法存取攝像頭: ", err);
                instructions.textContent = '錯誤：無法存取攝像頭。請檢查權限。';
            }
        }

        // --- 2. 擷取畫面 ---
        snapButton.addEventListener('click', () => {
            if (state !== 'CAPTURING') return;

            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            snapshot = new Image();
            snapshot.src = canvas.toDataURL();
            video.srcObject.getTracks().forEach(track => track.stop());
            
            video.style.display = 'none';
            snapButton.style.display = 'none';
            canvas.style.display = 'block';
            controls.style.display = 'block';

            state = 'STAGE1_P1';
            updateInstructions();
        });

        // --- 3. Canvas 點擊處理 ---
        canvas.addEventListener('click', (e) => {
            const pos = getMousePos(canvas, e);
            
            try {
                switch (state) {
                    case 'STAGE1_P1':
                        // 重設所有點
                        points = { p1: pos, p1_5: null, p2: null, p3: null, p4: null };
                        setRefButton.disabled = true;
                        state = 'STAGE1_P2';
                        break;
                    
                    case 'STAGE1_P2':
                        points.p2 = pos;
                        // 設定 P1-P2 參考線
                        if (!lineMeasure.setBaseLine(points.p1, points.p2)) {
                            // P1 和 P2 在同一個點，退回 STAGE1_P1
                            alert("P1 和 P2 不能在同一個點。請重新點選。");
                            state = 'STAGE1_P1';
                            points = { p1: null, p1_5: null, p2: null, p3: null, p4: null };
                            break;
                        }
                        points.p1_5 = null; // 清除 P1.5
                        state = 'STAGE1_P1_5';
                        break;
                    
                    case 'STAGE1_P1_5':
                        // 將點擊位置投影到 P1-P2 線上
                        points.p1_5 = lineMeasure.projectPoint(pos).point;
                        setRefButton.disabled = false;
                        state = 'STAGE1_READY';
                        break;
                    
                    case 'STAGE1_READY':
                        // 準備鎖定。如果使用者再次點擊，視為重設 P1
                        state = 'STAGE1_P1';
                        canvas.dispatchEvent(new MouseEvent('click', e)); // 模擬 P1 點擊
                        return; // 避免 redrawCanvas 執行兩次

                    case 'STAGE2_P3':
                        // P3 必須在 P1-P2 線上
                        points.p3 = lineMeasure.projectPoint(pos).point;
                        points.p4 = null;
                        state = 'STAGE2_P4';
                        resultDisplay.textContent = '丈量結果：-';
                        break;

                    case 'STAGE2_P4':
                        // P4 也必須在 P1-P2 線上
                        points.p4 = lineMeasure.projectPoint(pos).point;
                        calculateDistance(); // 計算
                        state = 'STAGE2_P3'; // 準備下一次 P3 點選
                        break;
                }
            } catch (err) {
                console.error("點擊處理時發生錯誤:", err);
            }
            
            redrawCanvas();
            updateInstructions();
        });

        // --- 4. 鎖定參考線並計算校準模型 ---
        setRefButton.addEventListener('click', () => {
            const real_d1 = parseFloat(refDistInput1.value);
            const real_d2 = parseFloat(refDistInput2.value);
            
            if (isNaN(real_d1) || isNaN(real_d2) || real_d1 <= 0 || real_d2 <= 0) {
                alert('請輸入兩個有效的實際距離（均大於 0）。');
                return;
            }

            if (points.p1 && points.p1_5 && points.p2) {
                
                // *** 核心邏輯改由 class 處理 ***
                const calibResult = lineMeasure.calibrate(points.p1_5, real_d1, real_d2);

                if (!calibResult.success) {
                    alert(calibResult.message);
                    points.p1_5 = null;
                    state = 'STAGE1_P1_5';
                    setRefButton.disabled = true;
                    redrawCanvas();
                    updateInstructions();
                    return;
                }

                // 鎖定第一階段
                state = 'STAGE2_P3';
                refDistInput1.disabled = true;
                refDistInput2.disabled = true;
                setRefButton.disabled = true;
                setRefButton.textContent = '參考線已鎖定';
                
                points.p3 = null;
                points.p4 = null;
                
                updateInstructions();
                redrawCanvas();
            }
        });

        // --- 5. 繪圖與計算輔助函式 ---

        function redrawCanvas() {
            if (!snapshot) return;
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(snapshot, 0, 0);

            // 繪製無限長的參考線
            if (points.p1 && points.p2) {
                drawInfiniteLine(points.p1, points.p2, 'rgba(255, 0, 0, 0.5)', 2);
            }
            if (points.p1) drawPoint(points.p1, 'red', 'P1');
            if (points.p2) drawPoint(points.p2, 'red', 'P2');
            if (points.p1_5) drawPoint(points.p1_5, 'orange', 'P1.5');
            
            // 繪製丈量線 (Stage 2)
            if (points.p3) {
                drawPoint(points.p3, 'blue', "P3");
            }
            if (points.p4) {
                drawPoint(points.p4, 'blue', "P4");
                drawLine(points.p3, points.p4, 'blue', 3);
            }
        }

        function calculateDistance() {
            if (!points.p3 || !points.p4) return;
            
            try {
                // *** 核心邏輯改由 class 處理 ***
                const realMeasure = lineMeasure.calculateRealDistance(points.p3, points.p4);
                resultDisplay.textContent = `丈量結果：${realMeasure.toFixed(3)} (單位同參考距離)`;
            } catch (err) {
                console.error("計算距離時發生錯誤:", err);
                resultDisplay.textContent = '丈量結果：錯誤';
            }
        }
        
        // --- 6. UI 與工具函式 (保持不變) ---

        function updateInstructions() {
            switch (state) {
                case 'INIT': instructions.textContent = '正在啟動攝像頭...'; break;
                case 'CAPTURING': instructions.textContent = '請將攝像頭對準目標，然後按 [擷取畫面]'; break;
                case 'STAGE1_P1': instructions.textContent = '【階段1】請點擊參考線的 起點 (P1)'; break;
                case 'STAGE1_P2': instructions.textContent = '【階段1】請點擊參考線的 終點 (P2)'; break;
                case 'STAGE1_P1_5': instructions.textContent = '【階段1】請點擊 P1 和 P2 之間的 中點 (P1.5)'; break;
                case 'STAGE1_READY': instructions.textContent = '【階段1】請輸入實際距離並 [鎖定]，或 重新點擊P1 重設'; break;
                case 'STAGE2_P3': instructions.textContent = '【階段2】參考線已鎖動。請點擊線上丈量 起點 (P3)'; break;
                case 'STAGE2_P4': instructions.textContent = '【階段2】請點擊線上丈量 終點 (P4) 以計算距離'; break;
            }
        }

        function getMousePos(canvasEl, evt) {
            const rect = canvasEl.getBoundingClientRect();
            const scaleX = canvasEl.width / rect.width;
            const scaleY = canvasEl.height / rect.height;
            return {
                x: (evt.clientX - rect.left) * scaleX,
                y: (evt.clientY - rect.top) * scaleY
            };
        }

        function drawPoint(p, color, label) {
            ctx.beginPath();
            ctx.arc(p.x, p.y, 5, 0, 2 * Math.PI);
            ctx.fillStyle = color;
            ctx.fill();
            ctx.strokeStyle = 'white';
            ctx.lineWidth = 1;
            ctx.stroke();
            
            ctx.fillStyle = color;
            ctx.font = '16px Arial';
            ctx.shadowColor = 'white';
            ctx.shadowBlur = 3;
            ctx.fillText(label, p.x + 8, p.y + 5);
            ctx.shadowBlur = 0;
        }

        function drawLine(pA, pB, color, lineWidth = 2, dashed = false) {
            ctx.beginPath();
            ctx.strokeStyle = color;
            ctx.lineWidth = lineWidth;
            if (dashed) ctx.setLineDash([5, 5]);
            ctx.moveTo(pA.x, pA.y);
            ctx.lineTo(pB.x, pB.y);
            ctx.stroke();
            if (dashed) ctx.setLineDash([]);
        }
        
        function drawInfiniteLine(pA, pB, color, lineWidth = 2) {
            // 繪製一條非常長的線，Canvas 會自動裁切
            const v = { x: pB.x - pA.x, y: pB.y - pA.y };
            const start = { x: pA.x - v.x * 1000, y: pA.y - v.y * 1000 };
            const end = { x: pA.x + v.x * 1000, y: pA.y + v.y * 1000 };
            
            ctx.beginPath();
            ctx.strokeStyle = color;
            ctx.lineWidth = lineWidth;
            ctx.moveTo(start.x, start.y);
            ctx.lineTo(end.x, end.y);
            ctx.stroke();
        }

        // --- 程式進入點 ---
        startCamera();

    </script>
</body>
</html>
